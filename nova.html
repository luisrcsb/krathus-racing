<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krathus Racing - Central de Telemetria</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root { --bg-body: #0d111a; --bg-card: #151c28; --bg-card-header: #1c2638; --bg-input: #1c263b; --border-card: #222d42; --text-title: #ffffff; --text-main: #d0d7e3; --text-muted: #8492a6; --accent-red: #e63946; --accent-green: #2ec4b6; --accent-gold: #ffb703; --accent-blue: #3a86ff; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 24px; }
        .dashboard-container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 20px 24px; border-radius: 12px; border: 1px solid var(--border-card); }
        .btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; }
        .btn-action-primary { background: var(--accent-blue); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-action-danger { background: var(--accent-red); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(13, 17, 26, 0.88); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border-card); border-top: 5px solid var(--accent-gold); border-radius: 14px; width: 90%; max-width: 1100px; padding: 20px; }
        .config-panel { background: var(--bg-input); border: 1px solid var(--border-card); border-radius: 10px; padding: 16px; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Modais -->
    <div id="campeonatos-modal" class="custom-modal">
        <div class="modal-content">
            <div class="modal-header"><h3>🏆 Championship Manager</h3></div>
            <div class="modal-body" style="margin-top: 20px;">
                <div id="container-zround-campeonato" style="display: none; flex-direction: column; gap: 15px;">
                    <h3 id="zround-camp-titulo-ativo">Configurando...</h3>
                    <div id="zround-aba-1">
                        <div class="config-panel">
                            <h4>Parâmetros Gerais</h4>
                            <!-- Botões de Ação na Aba 1 -->
                            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
                                <button class="btn-action-danger" onclick="excluirCampeonatoAtual()">Excluir Campeonato</button>
                                <button class="btn-action-primary" onclick="salvarAba1ConfigGeral()">Salvar Configurações</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="dashboard-container">
        <header class="header">
            <h1>🏁 KRATHUS RACING</h1>
            <button onclick="abrirModalCampeonatos()">🏆 Championship Manager</button>
        </header>
    </div>

    <script>
        let db = firebase.database();
        let campeonatoAtivoKey = null;

        // FUNÇÃO DE COMPARTILHAMENTO CORRIGIDA (Link único)
        window.compartilharCorrida = function(bateriaKey, nomeSessao) {
            let linkPainel = window.location.href.split('#')[0];
            let txt = `🏁 *KRATHUS RACING - TELEMETRIA* 🏁\n` +
                      `🗓️ Sessão: *${nomeSessao}*\n\n` +
                      `🔎 Confira todos os detalhes no painel:\n${linkPainel}`;

            if (navigator.share) {
                navigator.share({ title: 'Krathus Racing', text: txt, url: linkPainel }).catch(() => {});
            } else {
                navigator.clipboard.writeText(txt).then(() => alert("📋 Relatório copiado!"));
            }
        };

        // FUNÇÃO DE EXCLUSÃO DE CAMPEONATO
        window.excluirCampeonatoAtual = function() {
            if (!campeonatoAtivoKey) return;
            if (confirm("⚠️ TEM CERTEZA? Isso excluirá permanentemente este campeonato.")) {
                db.ref('campeonatos/' + campeonatoAtivoKey).remove().then(() => {
                    alert("✅ Campeonato excluído!");
                    // Lógica para fechar modal e atualizar lista
                    document.getElementById('campeonatos-modal').style.display = 'none';
                });
            }
        };

        window.abrirModalCampeonatos = function() { document.getElementById('campeonatos-modal').style.display = 'flex'; };
        
        // Inicialização básica do Firebase e outros processos seguem aqui...
    </script>
</body>
</html>
