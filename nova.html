<!-- nova.html - Atualizada: Proteção contra Duplicidade e Gestão de Metadados de Pilotos -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Krathus Racing - Gestão Avançada</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root { --bg-body: #0d111a; --bg-card: #151c28; --border-card: #222d42; --accent-gold: #ffb703; --accent-blue: #3a86ff; --accent-red: #e63946; }
        body { background-color: var(--bg-body); color: #d0d7e3; padding: 24px; font-family: sans-serif; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-card); padding: 20px; border-radius: 12px; width: 600px; max-height: 80vh; overflow-y: auto; border: 1px solid var(--border-card); }
        .checkbox-list { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; max-height: 150px; overflow-y: auto; border: 1px solid var(--border-card); padding: 10px; }
    </style>
</head>
<body>

    <!-- Modal Pilotos -->
    <div id="pilotos-modal" class="modal">
        <div class="modal-content">
            <h2>🏎️ Cadastro de Pilotos</h2>
            <input type="text" id="p-nome" placeholder="Nome do Piloto" style="width:100%; padding:8px; margin:5px 0;">
            <input type="text" id="p-carro" placeholder="Modelo do Carro" style="width:100%; padding:8px; margin:5px 0;">
            <button onclick="salvarPiloto()">Salvar no Banco Metadados</button>
            
            <h3 style="margin-top:20px;">Vincular Pilotos Existentes</h3>
            <div id="lista-checkbox-pilotos" class="checkbox-list"></div>
            <button onclick="vincularSelecionados()" style="margin-top:10px;">Vincular Selecionados</button>
            <button onclick="document.getElementById('pilotos-modal').style.display='none'">Fechar</button>
        </div>
    </div>

    <!-- Interface -->
    <button onclick="document.getElementById('upload-modal').style.display='flex'">📤 Uploads</button>
    <button onclick="document.getElementById('pilotos-modal').style.display='flex'">🏎️ Pilotos</button>

    <script>
        const firebaseConfig = { /* suas credenciais aqui */ };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. Prevenção de Duplicidade no Upload
        window.processarUploadEEnviarNuvem = async function() {
            let files = document.getElementById('input-pdf-upload').files;
            for (let file of files) {
                let batKey = "bat_" + file.name.replace('.pdf', '').toLowerCase().replace(/[^a-z0-9]/g, "_");
                
                // Verifica se já existe
                let snapshot = await db.ref('baterias/' + batKey).once('value');
                if (snapshot.exists()) {
                    alert(`O arquivo ${file.name} já existe no banco. Upload cancelado.`);
                    continue;
                }

                // Prossegue com parse e envio (código de parsing omitido por brevidade)
                alert(`Upload de ${file.name} realizado!`);
            }
        };

        // 2. Cadastro e Banco de Metadados
        window.salvarPiloto = async function() {
            let nome = document.getElementById('p-nome').value;
            let carro = document.getElementById('p-carro').value;
            
            // Salva no banco metadadosPiloto
            await db.ref('metadadosPiloto/' + nome.replace(/\s+/g, '_')).set({
                nome: nome,
                carro: carro,
                dataCadastro: Date.now()
            });
            alert("Salvo em metadadosPiloto!");
        };

        // 3. Vincular via Checkbox
        db.ref('metadadosPiloto').on('value', snap => {
            let container = document.getElementById('lista-checkbox-pilotos');
            container.innerHTML = "";
            snap.forEach(child => {
                container.innerHTML += `<label><input type="checkbox" value="${child.key}"> ${child.val().nome}</label>`;
            });
        });

        window.vincularSelecionados = function() {
            let selecionados = document.querySelectorAll('#lista-checkbox-pilotos input:checked');
            selecionados.forEach(c => {
                console.log("Vinculando piloto:", c.value);
                // Lógica para vincular ao contexto atual
            });
        };
    </script>
</body>
</html>
