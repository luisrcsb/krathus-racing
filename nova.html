<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Krathus Racing - Central Telemetria V4.5</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <style>
        :root { --bg-body: #0d111a; --bg-card: #151c28; --text-title: #ffffff; --text-main: #d0d7e3; --accent-blue: #3a86ff; --accent-red: #e63946; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 24px; font-family: sans-serif; }
        .card { background: var(--bg-card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #222d42; }
        .btn { padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; color: white; background: var(--accent-blue); }
        .bateria-item { background: #1c263b; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🏁 Central de Telemetria (v4.5)</h1>
        <input type="file" id="input-pdf" accept=".pdf" multiple>
        <button class="btn" onclick="processarUpload()">Processar Arquivos</button>
    </div>

    <div class="card">
        <h2>📊 Gráfico: Posição Volta a Volta</h2>
        <div id="grafico-container"><canvas id="graficoTelemetria"></canvas></div>
    </div>

    <div class="card" id="lista-baterias"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDCTkeIa6QsY2zYs8S__HlIwcY-zcuhZCA",
            authDomain: "krathus-telemetria.firebaseapp.com",
            projectId: "krathus-telemetria",
            databaseURL: "https://krathus-telemetria-default-rtdb.firebaseio.com"
        };
        const db = firebase.initializeApp(firebaseConfig).database();
        const DB_PATH = 'baterias_v4';

        async function processarUpload() {
            const files = Array.from(document.getElementById('input-pdf').files);
            const promessas = files.map(async (file) => {
                const texto = await converterPdfParaTexto(file);
                const dados = parsearTextoConvertido(texto, file.name);
                await db.ref(DB_PATH).push({ nomeArquivo: file.name, timestamp: Date.now(), dados });
            });
            await Promise.all(promessas);
            alert("Processamento concluído!");
        }

        async function converterPdfParaTexto(arquivo) {
            const arrayBuffer = await arquivo.arrayBuffer();
            const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let textoCompleto = "";
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const page = await pdfDoc.getPage(i);
                const content = await page.getTextContent();
                content.items.forEach(item => textoCompleto += item.str + " ");
            }
            return textoCompleto;
        }

        function parsearTextoConvertido(texto, sessao) {
            // Lógica de parser que você já usa no seu ambiente atual
            // (Certifique-se de manter sua lógica de regex que extrai os pilotos e tempos aqui)
            return []; // O array de pilotos extraídos
        }

        function renderizarGrafico(bateria) {
            const ctx = document.getElementById('graficoTelemetria').getContext('2d');
            const maxVoltas = Math.max(...bateria.dados.map(p => p.laps.length));

            const datasetsLinhas = bateria.dados.map(p => ({
                label: p.piloto, data: p.laps, fill: false, tension: 0.1
            }));

            const pontosFinais = {
                label: 'Última Volta (DNF)',
                data: bateria.dados
                    .filter(p => p.laps.length < maxVoltas)
                    .map(p => ({ x: p.laps.length - 1, y: p.laps[p.laps.length - 1] })),
                pointRadius: 8, pointStyle: 'crossRot', backgroundColor: 'red', showLine: false
            };

            if (window.meuGrafico) window.meuGrafico.destroy();
            window.meuGrafico = new Chart(ctx, {
                type: 'line',
                data: { datasets: [...datasetsLinhas, pontosFinais] },
                options: { scales: { y: { reverse: true } } }
            });
        }

        db.ref(DB_PATH).on('value', snap => {
            const container = document.getElementById('lista-baterias');
            const lista = [];
            snap.forEach(cs => lista.push({ key: cs.key, ...cs.val() }));
            container.innerHTML = lista.map((b, i) => `
                <div class="bateria-item">
                    <span>${b.nomeArquivo}</span>
                    <button class="btn" onclick='renderizarGrafico(${JSON.stringify(b)})'>Ver Gráfico</button>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
