<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krathus Racing - Central de Telemetria</title>
    <!-- Bibliotecas e Estilos mantidos conforme sua versão 5.48.2 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root { --bg-body: #0d111a; --bg-card: #151c28; --accent-red: #e63946; --accent-blue: #3a86ff; --accent-gold: #ffb703; --accent-green: #2ec4b6; --text-main: #d0d7e3; --border-card: #222d42; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 24px; }
        .admin-only { display: none !important; }
        .dashboard-container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 20px; border-radius: 12px; }
        .btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; margin-left: 10px; }
        .btn-admin { background: var(--accent-blue); color: #fff; }
        .btn-sair { background: var(--accent-red); color: #fff; }
        .custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-card); padding: 20px; border-radius: 12px; width: 80%; max-width: 900px; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header class="header">
            <div>
                <h1>🏁 KRATHUS RACING</h1>
                <p>Central de Telemetria</p>
            </div>
            <div id="header-actions">
                <!-- Visível para todos -->
                <button class="btn" onclick="gerarRelatórioPDF()">📄 Relatório</button>
                
                <!-- Visível apenas para Admin -->
                <button class="btn btn-admin admin-only" onclick="abrirModalUpload()">📤 Uploads</button>
                <button class="btn btn-admin admin-only" onclick="abrirModalCampeonatos()">🏆 Championship Manager</button>
                
                <!-- Gatilho invisível -->
                <button class="btn" style="background: transparent; color: #555; font-size: 0.7rem;" onclick="ativarModoAdmin()">Admin</button>
                <button class="btn btn-sair admin-only" onclick="sairModoAdmin()">Sair</button>
            </div>
        </header>
        
        <div id="content">Conteúdo principal do site...</div>
    </div>

    <!-- Modais (Upload e Campeonato omitidos por brevidade, manter os seus originais) -->

    <script>
        const SENHA_UNIFICADA = "1234";

        // Lógica de Segurança
        function checarAdmin() {
            return sessionStorage.getItem('krathus_admin') === 'true';
        }

        window.ativarModoAdmin = function() {
            let senha = prompt("🔒 Acesso de Administrador:");
            if (senha === SENHA_UNIFICADA) {
                sessionStorage.setItem('krathus_admin', 'true');
                location.reload();
            } else {
                alert("❌ Senha incorreta.");
            }
        };

        window.sairModoAdmin = function() {
            sessionStorage.removeItem('krathus_admin');
            location.reload();
        };

        document.addEventListener("DOMContentLoaded", () => {
            if (checarAdmin()) {
                document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'inline-flex');
            }
        });

        // Mantenha aqui todo o seu código original de Firebase, Upload, ZRound e Charts...
        // ...
    </script>
</body>
</html>
