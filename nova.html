<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krathus Racing - Central de Gestão</title>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-body: #0d111a;
            --bg-card: #151c28;
            --bg-card-header: #1c2638;
            --bg-input: #1c263b;
            --border-card: #222d42;
            --text-title: #ffffff;
            --text-main: #d0d7e3;
            --text-muted: #8492a6;
            --accent-red: #e63946;
            --accent-green: #2ec4b6;
            --accent-gold: #ffb703;
            --accent-blue: #3a86ff;
            --accent-cc: #2a9d8f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 24px; }
        
        .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 12px; padding: 20px; }
        
        .btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600; font-size: 0.9rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
        .btn-compras-coletivas-trigger { background: linear-gradient(135deg, #2a9d8f 0%, #264653 100%); color: #fff; font-weight: 700; }

        /* Modal Iframe Externo */
        .custom-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(13, 17, 26, 0.9); z-index: 10000; justify-content: center; align-items: center; padding: 15px;
        }
        .modal-content-iframe {
            background: var(--bg-card); border: 1px solid var(--border-card); border-top: 5px solid var(--accent-cc); border-radius: 14px; width: 100%; max-width: 1200px; height: 92vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-header { padding: 16px 24px; background: var(--bg-card-header); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-card); }
        .modal-title { font-size: 1.15rem; font-weight: 700; color: var(--text-title); display: flex; align-items: center; gap: 10px; }
        .modal-close { background: transparent; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; font-weight: bold; }
        .modal-iframe-body { flex: 1; width: 100%; background: var(--bg-body); position: relative; }
        .modal-iframe-body iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
            <div>
                <h2>🏎️ Krathus Racing - Central de Controle</h2>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Gerenciamento Integrado</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-compras-coletivas-trigger" onclick="abrirModalComprasExterno()">🛒 Compras Coletivas</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE EXIBIÇÃO DA PÁGINA EXTERNA VIA IFRAME -->
    <div id="modal-compras-externo" class="custom-modal">
        <div class="modal-content-iframe">
            <div class="modal-header">
                <div class="modal-title">🛒 Compras Coletivas - Krathus Racing</div>
                <button class="modal-close" onclick="fecharModalComprasExterno()">&times;</button>
            </div>
            <div class="modal-iframe-body">
                <iframe id="iframe-compras-coletivas" src="" title="Compras Coletivas"></iframe>
            </div>
        </div>
    </div>

    <script>
        function abrirModalComprasExterno() {
            const modal = document.getElementById('modal-compras-externo');
            const iframe = document.getElementById('iframe-compras-coletivas');
            
            // Define o link externo solicitado em formato modal
            if (!iframe.src || iframe.src === "about:blank") {
                iframe.src = "https://luisrcsb.github.io/krathus-racing/compras.html";
            }
            
            modal.style.display = 'flex';
        }

        function fecharModalComprasExterno() {
            document.getElementById('modal-compras-externo').style.display = 'none';
        }

        // Fechar modal ao clicar fora da área de conteúdo
        window.addEventListener('click', function(event) {
            const modal = document.getElementById('modal-compras-externo');
            if (event.target === modal) {
                fecharModalComprasExterno();
            }
        });
    </script>
</body>
</html>
