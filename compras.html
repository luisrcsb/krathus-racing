<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krathus Racing - Gestão de Compras Coletivas</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-body: #0d111a;
            --bg-card: #151c28;
            --bg-card-header: #1c2638;
            --bg-input: #1c263b;
            --border-card: #222d42;
            --text-title: #ffffff;
            --text-main: #d0d7e3;
            --text-muted: #8492a6;
            --accent-red: #e63946;
            --accent-green: #2ec4b6;
            --accent-gold: #ffb703;
            --accent-blue: #3a86ff;
            --accent-cc: #2a9d8f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 24px; }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] { -moz-appearance: textfield; }
        
        .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 12px; padding: 20px; }
        
        .btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600; font-size: 0.9rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
        .btn-voltar { background: var(--bg-card-header); color: var(--text-main); border: 1px solid var(--border-card); }
        .btn-compras-coletivas-trigger { background: linear-gradient(135deg, #2a9d8f 0%, #264653 100%); color: #fff; font-weight: 700; }
        .btn-action-primary { background: var(--accent-cc); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
        .btn-action-danger { background: var(--accent-red); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
        .btn-action-summary { background: #480ca8; color: #fff; border: none; padding: 5px 12px; border-radius: 6px; font-weight: 600; font-size: 0.78rem; cursor: pointer; }
        .btn-action-track { background: #3f37c9; color: #fff; border: none; padding: 5px 12px; border-radius: 6px; font-weight: 600; font-size: 0.78rem; cursor: pointer; text-decoration: none; display: inline-block; }

        .custom-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(13, 17, 26, 0.88); z-index: 10000; justify-content: center; align-items: center; padding: 20px; overflow-y: auto;
        }
        .modal-content {
            background: var(--bg-card); border: 1px solid var(--border-card); border-top: 5px solid var(--accent-cc); border-radius: 14px; width: 100%; max-width: 1050px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden;
        }
        .modal-header { padding: 20px 24px; background: var(--bg-card-header); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-card); }
        .modal-title { font-size: 1.25rem; font-weight: 700; color: var(--text-title); display: flex; align-items: center; gap: 10px; }
        .modal-close { background: transparent; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; font-weight: bold; }
        .modal-body { padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; position: relative; }

        .config-panel { background: var(--bg-input); border: 1px solid var(--border-card); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
        .config-panel-title { font-size: 0.82rem; font-weight: 700; color: var(--accent-cc); text-transform: uppercase; border-bottom: 1px solid var(--border-card); padding-bottom: 8px; }
        .config-input { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-card); padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; }

        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th { background-color: var(--bg-card-header); color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; padding: 10px 14px; font-weight: 700; border-bottom: 1px solid var(--border-card); }
        td { padding: 10px 14px; border-bottom: 1px solid var(--border-card); vertical-align: middle; }

        .progress-bar-container { width: 100%; background-color: var(--bg-card); border-radius: 6px; border: 1px solid var(--border-card); overflow: hidden; height: 14px; margin-top: 4px; position: relative; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #2a9d8f, #2ec4b6); width: 0%; transition: width 0.3s; }
        .progress-bar-text { position: absolute; width: 100%; text-align: center; top: 0; font-size: 0.65rem; font-weight: 700; color: #fff; line-height: 14px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        .pix-clickable { cursor: pointer; transition: transform 0.1s ease; }
        .pix-clickable:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <div class="container">
        <div class="card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
            <div>
                <h2>🛒 Gestão de Compras Coletivas</h2>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Módulo Isolado - Krathus Racing</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <a href="index.html" class="btn btn-voltar">⬅️ Voltar à Central</a>
                <button class="btn btn-compras-coletivas-trigger" onclick="abrirModalCampeonatos2()">Abrir Painel de Gestão</button>
            </div>
        </div>
    </div>
