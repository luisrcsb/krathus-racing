<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krathus Racing - Painel de Controle ZRound</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --accent-hover: #3700b3;
            --border-color: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h1 {
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 25px;
        }
        .upload-section {
            border: 2px dashed var(--accent-color);
            padding: 25px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 25px;
            background: rgba(187, 134, 252, 0.05);
        }
        input[type="file"] {
            margin-top: 15px;
            color: var(--text-color);
        }
        button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #9965f4;
        }
        .output-box {
            background: #111;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Krathus Racing - Leitor ZRound</h1>
        
        <div class="upload-section">
            <p>Selecione o relatório da bateria (PDF ou HTML) gerado pelo ZRound:</p>
            <input type="file" id="reportFile" accept=".pdf, .html, .htm">
            <br>
            <button onclick="processReport()">Processar Relatório</button>
        </div>

        <div id="resultContainer" class="hidden">
            <h3>Resultado da Extração:</h3>
            <div id="outputBox" class="output-box"></div>
        </div>
    </div>

    <script>
        function processReport() {
            const fileInput = document.getElementById('reportFile');
            const resultContainer = document.getElementById('resultContainer');
            const outputBox = document.getElementById('outputBox');

            if (fileInput.files.length === 0) {
                alert('Por favor, selecione um arquivo primeiro.');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(event) {
                resultContainer.classList.remove('hidden');
                
                if (file.name.endsWith('.html') || file.name.endsWith('.htm')) {
                    // Processamento básico simulando a lógica do leitor para HTML no front-end
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(event.target.result, 'text/html');
                    
                    // Remove scripts e estilos
                    doc.querySelectorAll('script, style').forEach(el => el.remove());
                    
                    const textContent = doc.body.textContent || "";
                    const lines = textContent.split('\n').map(l => l.trim()).filter(l => l.length > 0);

                    outputBox.textContent = `Arquivo HTML Carregado com Sucesso!\nNome: ${file.name}\nTotal de linhas extraídas: ${lines.length}\n\n--- Amostra de Linhas ---\n` + lines.slice(0, 10).join('\n');
                } else {
                    // Para PDF, indicamos o fluxo que será tratado pelo backend Python integrado
                    outputBox.textContent = `Arquivo PDF selecionado: ${file.name}\nO arquivo está pronto para ser enviado ao backend Python (ZRoundReportReader) para a extração completa de layouts e tabelas.`;
                }
            };

            if (file.name.endsWith('.html') || file.name.endsWith('.htm')) {
                reader.readAsText(file);
            } else {
                reader.readAsDataURL(file);
            }
        }
    </script>

</body>
</html>
