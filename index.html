<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krathus Racing - Central de Telemetria e Gestão</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-body: #0d111a;
            --bg-card: #151c28;
            --bg-card-header: #1c2638;
            --bg-input: #1c263b;
            --border-card: #222d42;
            --text-title: #ffffff;
            --text-main: #d0d7e3;
            --text-muted: #8492a6;
            --accent-red: #e63946;
            --accent-green: #2ec4b6;
            --accent-gold: #ffb703;
            --accent-blue: #3a86ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 24px; }
        .dashboard-container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

        #mobile-orientation-warning {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(13, 17, 26, 0.96);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            gap: 15px;
            overflow-y: auto;
        }
        .orientation-icon { font-size: 3rem; animation: rotatePhone 2s infinite ease-in-out; }
        .orientation-title { font-size: 1.2rem; font-weight: 700; color: var(--text-title); max-width: 90%; }
        .orientation-text { font-size: 0.85rem; color: var(--text-muted); max-width: 280px; line-height: 1.4; }
        
        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        @media screen and (max-width: 768px) and (orientation: portrait) {
            #mobile-orientation-warning { display: flex; }
        }

        .header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 20px 24px; border-radius: 12px; border: 1px solid var(--border-card); flex-wrap: wrap; gap: 15px; }
        .brand-title h1 { font-size: 1.5rem; color: var(--text-title); letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        .brand-title p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

        .header-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: opacity 0.2s; }
        .btn-text-action { background: transparent; border: none; color: var(--accent-blue); font-size: 0.78rem; font-weight: 600; cursor: pointer; padding: 0; text-align: left; }
        .btn-text-action:hover { text-decoration: underline; }

        .btn-pdf-global { background: linear-gradient(135deg, #ff5722 0%, #e63946 100%); color: #ffffff; font-size: 0.9rem; padding: 10px 18px; font-weight: 700; border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 4px 15px rgba(255, 87, 34, 0.4); width: fit-content; }
        
        .btn-share { background: rgba(58, 134, 255, 0.15); color: var(--accent-blue); border: 1px solid var(--accent-blue); padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.2s; }
        .btn-share:hover { background: rgba(58, 134, 255, 0.3); }

        .btn-like { background: rgba(230, 57, 70, 0.15); color: var(--accent-red); border: 1px solid var(--accent-red); padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .btn-like:hover { background: rgba(230, 57, 70, 0.3); transform: scale(1.05); }

        .piloto-link { color: var(--accent-blue); text-decoration: none; font-weight: 700; cursor: pointer; transition: color 0.2s; }
        .piloto-link:hover { color: var(--accent-gold); text-decoration: underline; }

        /* Menu de Categorias Dinâmico */
        .menu-categorias-container { display: flex; gap: 10px; margin-bottom: 5px; flex-wrap: wrap; }
        .tab-categoria-btn { background: var(--bg-input); border: 1px solid var(--border-card); color: var(--text-main); padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .tab-categoria-btn.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

        /* Módulo de Upload / Gestão de Arquivos */
        .upload-section { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .upload-row { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .file-list-box { max-height: 180px; overflow-y: auto; background: var(--bg-input); border: 1px solid var(--border-card); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
        .file-item-row { display: flex; justify-content: space-between; align-items: center; background: rgba(21, 28, 40, 0.6); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-card); font-size: 0.85rem; }

        /* Modal / Ficha do Piloto */
        #piloto-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(13, 17, 26, 0.88);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-top: 5px solid var(--accent-gold);
            border-radius: 14px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: modalFadeIn 0.3s ease-in-out;
            overflow: hidden;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-header { padding: 20px 24px; background: var(--bg-card-header); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-card); }
        .modal-title { font-size: 1.25rem; font-weight: 700; color: var(--text-title); display: flex; align-items: center; gap: 10px; }
        .modal-close { background: transparent; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; font-weight: bold; transition: color 0.2s; }
        .modal-close:hover { color: var(--accent-red); }
        .modal-body { padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        
        .badges-podium-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 5px; }
        .badge-achievement { background: linear-gradient(135deg, rgba(255, 183, 3, 0.2) 0%, rgba(255, 183, 3, 0.05) 100%); border: 1px solid var(--accent-gold); color: var(--accent-gold); padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.82rem; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 2px 8px rgba(255, 183, 3, 0.15); }
        .badge-achievement.silver { background: linear-gradient(135deg, rgba(132, 146, 166, 0.2) 0%, rgba(132, 146, 166, 0.05) 100%); border-color: var(--text-muted); color: var(--text-title); }
        .badge-achievement.green-tag { background: linear-gradient(135deg, rgba(46, 196, 182, 0.2) 0%, rgba(46, 196, 182, 0.05) 100%); border-color: var(--accent-green); color: var(--accent-green); }

        .dossier-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        .dossier-kpi { background: var(--bg-input); border: 1px solid var(--border-card); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 4px; text-align: center; }
        .dossier-kpi-label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .dossier-kpi-value { font-size: 1.25rem; font-weight: 700; color: var(--accent-gold); }

        .positions-ranking-box { background: var(--bg-input); border: 1px solid var(--border-card); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .positions-ranking-title { font-size: 0.85rem; font-weight: 700; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 0.5px; }
        .positions-pills-grid { display: flex; flex-wrap: wrap; gap: 10px; }
        .position-pill { background: var(--bg-card); border: 1px solid var(--border-card); padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
        .position-pill span { font-weight: 700; color: var(--text-title); }

        .dossier-report-box { background: var(--bg-input); border-left: 4px solid var(--accent-blue); border-radius: 8px; padding: 18px; font-size: 0.9rem; line-height: 1.6; color: var(--text-main); display: flex; flex-direction: column; gap: 10px; }
        .dossier-report-title { font-size: 0.85rem; font-weight: 700; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 0.5px; }

        .tab-content { display: flex; flex-direction: column; gap: 20px; }

        .welcome-card { background: linear-gradient(135deg, var(--bg-card) 0%, rgba(28, 38, 56, 0.7) 100%); border: 1px solid var(--border-card); border-left: 5px solid var(--accent-blue); border-radius: 12px; padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .welcome-title { font-size: 1.1rem; font-weight: 700; color: var(--text-title); display: flex; align-items: center; gap: 8px; }
        .welcome-text { font-size: 0.9rem; color: var(--text-main); line-height: 1.6; }
        .changelog-box { background: var(--bg-input); border: 1px solid var(--border-card); border-radius: 8px; padding: 12px 16px; margin-top: 4px; display: flex; flex-direction: column; gap: 6px; }
        .changelog-header { font-size: 0.78rem; font-weight: 700; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 0.5px; }
        .changelog-list { font-size: 0.85rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 4px; padding-left: 16px; }

        .filters-card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 18px; }
        .filters-grid { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 20px; }
        .filter-group { display: flex; flex-direction: column; gap: 12px; }
        .filter-group-header { display: flex; justify-content: space-between; align-items: center; }
        .filter-group label.group-title { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        
        .checkbox-container { background: var(--bg-input); border: 1px solid var(--border-card); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; max-height: 150px; overflow-y: auto; }
        .checkbox-item { display: flex; align-items: center; gap: 10px; font-size: 0.88rem; color: var(--text-main); cursor: pointer; }
        .checkbox-item input[type="checkbox"] { accent-color: var(--accent-red); width: 16px; height: 16px; cursor: pointer; }

        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .kpi-card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .kpi-label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .kpi-value { font-size: 1.5rem; font-weight: 700; color: var(--text-title); margin: 8px 0 4px 0; }
        .kpi-value.green { color: var(--accent-green); }
        .kpi-subtext { font-size: 0.8rem; color: var(--text-muted); }

        .session-block-header { background: linear-gradient(135deg, var(--bg-card-header) 0%, var(--bg-card) 100%); border: 1px solid var(--border-card); border-left: 5px solid var(--accent-red); border-radius: 10px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; flex-wrap: wrap; gap: 10px; }
        .session-block-title { font-size: 1.15rem; font-weight: 700; color: var(--text-title); display: flex; align-items: center; gap: 10px; }
        .session-block-meta { font-size: 0.85rem; color: var(--text-muted); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .session-winner-tag { background: rgba(255, 183, 3, 0.15); color: var(--accent-gold); border: 1px solid var(--accent-gold); padding: 4px 10px; border-radius: 6px; font-weight: 600; font-size: 0.82rem; }

        .session-blocks-container { display: flex; flex-direction: column; gap: 30px; }
        .session-block { display: flex; flex-direction: column; gap: 20px; background: rgba(21, 28, 40, 0.4); border: 1px solid var(--border-card); border-radius: 14px; padding: 20px; }
        .card { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 12px; padding: 20px; }
        .card-header { display: flex; align-items: center; gap: 10px; font-size: 1rem; font-weight: 700; color: var(--text-title); margin-bottom: 16px; }
        .card-header::before { content: ''; width: 4px; height: 16px; background-color: var(--accent-red); border-radius: 2px; }
        .chart-container { position: relative; height: 280px; width: 100%; }

        .position-analysis-container { margin-top: 20px; background: var(--bg-input); border-left: 4px solid var(--accent-gold); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .position-analysis-title { font-size: 0.85rem; font-weight: 700; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 0.5px; }
        .position-log-list { display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; line-height: 1.5; max-height: 220px; overflow-y: auto; }
        .position-log-item { background: rgba(21, 28, 40, 0.5); padding: 10px 14px; border-radius: 6px; border: 1px solid var(--border-card); }
        .tag-gain { color: var(--accent-green); font-weight: 700; }
        .tag-loss { color: var(--accent-red); font-weight: 700; }

        .comments-section { margin-top: 15px; background: var(--bg-input); border: 1px solid var(--border-card); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .comments-title { font-size: 0.85rem; font-weight: 700; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px; }
        .comments-list { display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto; }
        .comment-item { background: rgba(21, 28, 40, 0.6); padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border-card); font-size: 0.85rem; display: flex; flex-direction: column; gap: 6px; }
        .comment-header-row { display: flex; justify-content: space-between; align-items: center; }
        .comment-author { font-weight: 700; color: var(--accent-gold); }
        .comment-text { color: var(--text-main); word-break: break-word; line-height: 1.4; }
        .comment-reactions { display: flex; gap: 12px; margin-top: 4px; align-items: center; }
        .btn-comment-reaction { background: rgba(28, 38, 59, 0.8); border: 1px solid var(--border-card); color: var(--text-muted); padding: 3px 8px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.2s; }
        .btn-comment-reaction:hover { border-color: var(--accent-blue); color: var(--text-title); background: rgba(58, 134, 255, 0.15); }
        
        .comment-form { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
        .comment-input-name { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 6px; padding: 8px 12px; color: var(--text-main); font-size: 0.85rem; width: 160px; }
        .comment-input-text { flex: 1; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 6px; padding: 8px 12px; color: var(--text-main); font-size: 0.85rem; min-width: 200px; }
        .btn-comment { background: var(--accent-blue); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: opacity 0.2s; }
        .btn-comment:hover { opacity: 0.9; }

        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th { background-color: var(--bg-card-header); color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; padding: 12px 16px; font-weight: 700; border-bottom: 1px solid var(--border-card); }
        td { padding: 12px 16px; border-bottom: 1px solid var(--border-card); vertical-align: middle; }
        .main-row td { border-bottom: none !important; }
        .sub-row td { padding: 0 16px 16px 16px !important; border-bottom: 1px solid var(--border-card) !important; }

        .pos-badge { background: var(--accent-gold); color: #000; font-weight: bold; font-size: 0.8rem; padding: 4px 8px; border-radius: 4px; display: inline-block; }
        .session-badge { background: #1d3557; color: var(--accent-blue); padding: 4px 10px; border-radius: 4px; font-size: 0.80rem; font-weight: 600; display: inline-block; }
        .text-green { color: var(--accent-green); font-weight: 700; }

        .analysis-subrow-box { background: rgba(28, 38, 59, 0.6); border-left: 4px solid var(--accent-blue); border-radius: 6px; padding: 14px 18px; font-size: 0.86rem; color: var(--text-main); line-height: 1.6; }
        .analysis-subrow-box strong.title { color: var(--accent-blue); text-transform: uppercase; font-size: 0.78rem; display: block; margin-bottom: 6px; letter-spacing: 0.5px; }
        
        .fastest-lap-highlight { background-color: rgba(46, 196, 182, 0.15) !important; color: var(--accent-green) !important; font-weight: bold; border-radius: 4px; padding: 4px 8px; border: 1px solid var(--accent-green); }
        .absolute-fastest-lap-highlight { background-color: rgba(255, 183, 3, 0.25) !important; color: var(--accent-gold) !important; font-weight: bold; border-radius: 4px; padding: 4px 8px; border: 1px solid var(--accent-gold); box-shadow: 0 0 10px rgba(255, 183, 3, 0.2); }
        
        .gato-lap-highlight { background-color: rgba(230, 57, 70, 0.2) !important; border: 1px solid var(--accent-red) !important; color: var(--accent-red) !important; border-radius: 4px; padding: 4px 8px; text-decoration: line-through; }
        
        .lap-cell-inline { display: inline-flex; align-items: baseline; gap: 6px; white-space: nowrap; }
        .lap-diff-inline { font-size: 0.75rem; color: var(--accent-green); font-weight: 600; }

        .footer-container { background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 10px; }
        .footer-meta-info { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 16px; font-size: 0.82rem; color: var(--text-muted); background: var(--bg-input); padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-card); }
        .footer-logos { display: flex; align-items: center; justify-content: center; gap: 28px; }
        .footer-logo-img { height: 36px; width: auto; object-fit: contain; border-radius: 4px; padding: 3px 6px; background: #ffffff; }
        .footer-copyright { font-size: 0.85rem; color: var(--text-muted); text-align: center; border-top: 1px solid var(--border-card); padding-top: 12px; width: 100%; }

        @media print {
            body, body * { color: #000000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            body { background-color: #ffffff !important; padding: 10px !important; font-size: 11px !important; }
            .header-actions, .filters-card, .btn-pdf-global, .btn-share, .btn-like, .comments-section, .welcome-card, #piloto-modal, .upload-section, .menu-categorias-container { display: none !important; }
            .header { background: #ffffff !important; border: 1px solid #d1d5db !important; }
            .kpi-card { background: #f9fafb !important; border: 1px solid #d1d5db !important; }
            .card { background: #ffffff !important; border: 1px solid #9ca3af !important; }
            .chart-container { background-color: #e5e7eb !important; border: 1px solid #9ca3af !important; border-radius: 6px; padding: 10px !important; }
            .position-analysis-container { background: #f3f4f6 !important; border-left-color: #000 !important; }
            .footer-container { background: #ffffff !important; border: 1px solid #d1d5db !important; }
        }
    



    
    <div id="piloto-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modal-piloto-nome">🏎️ Ficha do Piloto</div>
                <button class="modal-close" onclick="fecharDossiePiloto()">×</button>
            </div>
            <div class="modal-body" id="modal-piloto-corpo"></div>
        </div>
    </div>

    <div id="mobile-orientation-warning">
        <div class="orientation-icon">📱🔄</div>
        <div class="orientation-title">Melhor Visualização em Paisagem</div>
        <div class="orientation-text">Para analisar os gráficos de telemetria e as tabelas com conforto, por favor, vire o seu celular na horizontal.</div>
    </div>

    <div class="dashboard-container">
        <header class="header">
            <div class="brand-title">
                <h1>🏁 KRATHUS RACING</h1>
                <p>Central de Telemetria e Análise de Desempenho</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-pdf-global" onclick="gerarRelatórioPDF()">📄 Gerar Relatório PDF Completo</button>
            </div>
        </header>

        
        <section class="upload-section">
            <div class="card-header" style="margin-bottom:0;">📤 Gestão e Upload de Arquivos (Banco: Upload)</div>
            <div class="upload-row">
                <input type="file" id="fileInput" multiple accept=".json" style="color:var(--text-main);">
                <button class="btn" style="background:var(--accent-blue); color:#fff;" onclick="processarUpload()">Subir Arquivos</button>
            </div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">Arquivos enviados anteriormente salvos no servidor:</div>
            <div class="file-list-box" id="lista-arquivos-servidor">
                <span style="color:var(--text-muted); font-size:0.85rem;">Carregando arquivos...</span>
            </div>
        </section>

    <script src="banco-de-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDCTkeIa6QsY2zYs8S__HlIwcY-zcuhZCA",
            authDomain: "krathus-telemetria.firebaseapp.com",
            projectId: "krathus-telemetria",
            storageBucket: "krathus-telemetria.firebasestorage.app",
            messagingSenderId: "1051581039922",
            appId: "1:1051581039922:web:d8ae00eb4ab45fa3d5432b",
            measurementId: "G-JPR41S7CZ3",
            databaseURL: "https://krathus-telemetria-default-rtdb.firebaseio.com"
        };

        let database = null;
        try {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
        } catch (e) {
            console.warn("Erro ao inicializar o Firebase:", e);
        }

        const SENHA_ADMIN = "krathus2026";
        let chartInstances = [];
        let arquivosNoServidor = {};
        let arquivosExistentesSet = new Set();
        let categoriaAtivaSelecionada = null;

        document.addEventListener("DOMContentLoaded", () => {
            inicializarBancoUpload();
        });

        function inicializarBancoUpload() {
            if (!database) {
                if (typeof listaJsonsCache !== 'undefined') {
                    processarDadosLocais(listaJsonsCache);
                }
                return;
            }

            // Ouvindo o banco de dados chamado "Upload"
            database.ref('Upload').on('value', snapshot => {
                arquivosNoServidor = {};
                arquivosExistentesSet.clear();
                let listaCacheDinamica = [];

                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        let key = child.key;
                        let val = child.val();
                        arquivosNoServidor[key] = val;
                        if (val.nomeArquivo) {
                            arquivosExistentesSet.add(val.nomeArquivo);
                        }
                        if (val.conteudo) {
                            if (Array.isArray(val.conteudo)) {
                                listaCacheDinamica.push({ id: key, dados: val.conteudo, nomeArquivo: val.nomeArquivo });
                            } else if (val.conteudo.dados && Array.isArray(val.conteudo.dados)) {
                                listaCacheDinamica.push({ id: key, dados: val.conteudo.dados, nomeArquivo: val.nomeArquivo });
                            }
                        }
                    });
                }

                window.listaJsonsCache = listaCacheDinamica;
                renderizarListaArquivosUpload();
                atualizarMenuCategoriasDinamico();
                gerarFiltrosDinamicos();
                atualizarDashboard();
            });
        }

        function processarDadosLocais(cache) {
            window.listaJsonsCache = cache;
            renderizarListaArquivosUpload();
            atualizarMenuCategoriasDinamico();
            gerarFiltrosDinamicos();
            atualizarDashboard();
        }

        function classificarPorNome(nome) {
            const n = (nome || '').toLowerCase();
            if (n.includes('bateria')) return 'bateria';
            if (n.includes('treino')) return 'treino';
            if (n.includes('campeonato')) return 'campeonato';
            return 'outro';
        }

        function renderizarListaArquivosUpload() {
            const container = document.getElementById('lista-arquivos-servidor');
            if (!container) return;

            let chaves = Object.keys(arquivosNoServidor);
            if (chaves.length === 0) {
                container.innerHTML = `Nenhum arquivo enviado para o banco "Upload" ainda.`;
                return;
            }

            container.innerHTML = chaves.map(key => {
                let item = arquivosNoServidor[key];
                let nome = item.nomeArquivo || key;
                return `
                    <div class="file-item-row">
                        <span>📄 ${nome}</span>
                        <button class="btn" style="background:var(--accent-red); color:#fff; padding:3px 8px; font-size:0.75rem;" onclick="excluirArquivoUpload('${key}')">🗑️ Excluir</button>
                    </div>
                `;
            }).join('');
        }

        window.excluirArquivoUpload = function(key) {
            if (!database) {
                alert("Banco de dados não conectado!");
                return;
            }
            if (confirm("Deseja realmente excluir este arquivo do banco 'Upload'?")) {
                database.ref('Upload/' + key).remove().then(() => {
                    alert("Arquivo excluído com sucesso!");
                }).catch(err => {
                    alert("Erro ao excluir: " + err.message);
                });
            }
        };

        window.processarUpload = function() {
            const fileInput = document.getElementById('fileInput');
            const files = fileInput.files;
            if (files.length === 0) {
                alert("Selecione ao menos um arquivo JSON.");
                return;
            }

            if (!database) {
                alert("Firebase / Database não configurado.");
                return;
            }

            Array.from(files).forEach(file => {
                // Filtro contra duplicidade de arquivos
                if (arquivosExistentesSet.has(file.name)) {
                    console.warn("Arquivo duplicado ignorado: " + file.name);
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const conteudoJson = JSON.parse(e.target.result);
                        let dadosSalvar = {
                            nomeArquivo: file.name,
                            conteudo: conteudoJson,
                            criadoEm: Date.now()
                        };
                        let safeKey = 'item_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
                        database.ref('Upload/' + safeKey).set(dadosSalvar);
                    } catch (err) {
                        alert("Erro ao interpretar o arquivo JSON: " + file.name);
                    }
                };
                reader.readAsText(file);
            });

            fileInput.value = '';
            alert("Processo de upload concluído (duplicatas filtradas automaticamente).");
        };

        function atualizarMenuCategoriasDinamico() {
            const menuContainer = document.getElementById('menu-categorias-dinamico');
            if (!menuContainer) return;

            let categoriasDisponiveis = { bateria: 0, treino: 0, campeonato: 0 };

            if (typeof listaJsonsCache !== 'undefined') {
                listaJsonsCache.forEach(arq => {
                    let tipo = classificarPorNome(arq.nomeArquivo || '');
                    if (categoriasDisponiveis[tipo] !== undefined) {
                        categoriasDisponiveis[tipo]++;
                    }
                });
            }

            menuContainer.innerHTML = '';
            let htmlMenu = '';
            let primeiraEncontrada = null;

            ['bateria', 'treino', 'campeonato'].forEach(cat => {
                if (categoriasDisponiveis[cat] > 0) {
                    if (!primeiraEncontrada) primeiraEncontrada = cat;
                    let isActive = (categoriaAtivaSelecionada === cat) || (!categoriaAtivaSelecionada && cat === primeiraEncontrada);
                    if (isActive && !categoriaAtivaSelecionada) categoriaAtivaSelecionada = cat;

                    htmlMenu += `<button class="tab-categoria-btn ${isActive ? 'active' : ''}" onclick="selecionarCategoriaMenu('${cat}')">📂 ${cat.toUpperCase()} (${categoriasDisponiveis[cat]})</button>`;
                }
            });

            menuContainer.innerHTML = htmlMenu;
        }

        window.selecionarCategoriaMenu = function(cat) {
            categoriaAtivaSelecionada = cat;
            atualizarMenuCategoriasDinamico();
            atualizarDashboard();
        };

        function obterTodosDadosConsolidados() {
            let consolidado = [];
            if (typeof listaJsonsCache !== 'undefined') {
                listaJsonsCache.forEach(arq => {
                    let tipoArq = classificarPorNome(arq.nomeArquivo || '');
                    // Se houver categoria ativa selecionada, filtra por ela; caso contrário, traz tudo
                    if (!categoriaAtivaSelecionada || tipoArq === categoriaAtivaSelecionada || tipoArq === 'outro') {
                        if (arq.dados && Array.isArray(arq.dados)) {
                            consolidado = consolidado.concat(arq.dados);
                        }
                    }
                });
            }
            return consolidado;
        }

        function gerarFiltrosDinamicos() {
            let dados = obterTodosDadosConsolidados();
            const bateriasMap = {};
            const pilotosSet = new Set();

            dados.forEach(item => {
                if (item.bateriaKey && !bateriasMap[item.bateriaKey]) {
                    bateriasMap[item.bateriaKey] = item.sessao || item.bateriaKey;
                }
                if (item.piloto) pilotosSet.add(item.piloto);
            });

            const batContainer = document.getElementById('filtro-baterias-container');
            const pilContainer = document.getElementById('filtro-pilotos-container');

            if (!batContainer || !pilContainer) return;

            if (Object.keys(bateriasMap).length === 0) {
                batContainer.innerHTML = `<span style="font-size:0.85rem; color: var(--text-muted);">Nenhum dado nesta categoria.</span>`;
                pilContainer.innerHTML = `<span style="font-size:0.85rem; color: var(--text-muted);">Nenhum dado nesta categoria.</span>`;
                return;
            }

            batContainer.innerHTML = Object.keys(bateriasMap).map(key => `
                <label class="checkbox-item"><input type="checkbox" value="${key}" class="filter-bateria" checked onchange="atualizarDashboard()"> ${bateriasMap[key]}</label>
            `).join('');

            pilContainer.innerHTML = Array.from(pilotosSet).map(piloto => `
                <label class="checkbox-item"><input type="checkbox" value="${piloto}" class="filter-piloto" checked onchange="atualizarDashboard()"> ${piloto}</label>
            `).join('');
        }

        const coresPaleta = ["#2ec4b6", "#ffb703", "#e63946", "#3a86ff", "#ff006e", "#8338ec", "#38bdf8", "#fb8500", "#52b788"];
        function obterCorPiloto(nome) {
            let hash = 0;
            for (let i = 0; i < nome.length; i++) {
                hash = nome.charCodeAt(i) + ((hash << 5) - hash);
            }
            return coresPaleta[Math.abs(hash) % coresPaleta.length];
        }

        function limparSelecao(classeFiltro) {
            document.querySelectorAll(`.${classeFiltro}`).forEach(cb => cb.checked = false);
            atualizarDashboard();
        }

        window.abrirDossiePiloto = function(nomePiloto) {
            const modal = document.getElementById('piloto-modal');
            const titleEl = document.getElementById('modal-piloto-nome');
            const bodyEl = document.getElementById('modal-piloto-corpo');

            titleEl.innerHTML = `🏎️ Ficha do Piloto: <span style="color: var(--accent-gold);">${nomePiloto}</span>`;

            let dadosBase = obterTodosDadosConsolidados();
            
            let desviosGrid = {};
            dadosBase.forEach(d => {
                if (!d.laps) return;
                let lapsValidas = d.laps.filter(l => !(typeof l === 'object' && l.anulada)).map(l => typeof l === 'object' ? l.tempo : l);
                if (lapsValidas.length > 1) {
                    let media = lapsValidas.reduce((a,b)=>a+b, 0) / lapsValidas.length;
                    let variancia = lapsValidas.reduce((sum, t) => sum + Math.pow(t - media, 2), 0) / lapsValidas.length;
                    if (!desviosGrid[d.piloto]) desviosGrid[d.piloto] = [];
                    desviosGrid[d.piloto].push(Math.sqrt(variancia));
                }
            });

            let desvioMedioPiloto = {};
            for (let p in desviosGrid) {
                let soma = desviosGrid[p].reduce((a,b)=>a+b, 0);
                desvioMedioPiloto[p] = soma / desviosGrid[p].length;
            }

            let pilotoMaisConsistente = null;
            let menorDesvioGlobal = 999;
            for (let p in desvioMedioPiloto) {
                if (desvioMedioPiloto[p] < menorDesvioGlobal) {
                    menorDesvioGlobal = desvioMedioPiloto[p];
                    pilotoMaisConsistente = p;
                }
            }

            let participacoes = dadosBase.filter(d => d.piloto === nomePiloto);

            if (participacoes.length === 0) {
                bodyEl.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-muted);">Nenhum dado encontrado para este piloto.</div>`;
                modal.style.display = 'flex';
                return;
            }

            let totalCorridas = participacoes.length;
            let vitorias = 0;
            let melhorVoltaAbsolutaPiloto = 999999;
            let somaMediasPiloto = 0;
            let totalVoltasVálidasPiloto = 0;
            let tabelaHistoricoHtml = "";
            let contadorPosicoes = {};

            participacoes.forEach(part => {
                let posStr = String(part.pos || '99').replace('º','').trim();
                let posNum = parseInt(posStr) || 99;
                contadorPosicoes[posNum] = (contadorPosicoes[posNum] || 0) + 1;
                if (posNum === 1) vitorias++;

                let lapsRaw = part.laps || [];
                let lapsValidas = lapsRaw.filter(l => !(typeof l === 'object' && l.anulada)).map(l => typeof l === 'object' ? l.tempo : l);
                
                if (lapsValidas.length > 0) {
                    let melhorPart = Math.min(...lapsValidas);
                    if (melhorPart < melhorVoltaAbsolutaPiloto) {
                        melhorVoltaAbsolutaPiloto = melhorPart;
                    }

                    let somaPart = lapsValidas.reduce((a,b)=>a+b, 0);
                    let mediaPart = somaPart / lapsValidas.length;
                    somaMediasPiloto += mediaPart * lapsValidas.length;
                    totalVoltasVálidasPiloto += lapsValidas.length;

                    tabelaHistoricoHtml += `
                        <tr>
                            <td><span class="session-badge">${part.sessao || part.bateriaKey}</span></td>
                            <td><span class="pos-badge">${part.pos || '-'}</span></td>
                            <td>${lapsValidas.length} voltas</td>
                            <td class="text-green">${melhorPart.toFixed(3).replace('.',',')}s</td>
                            <td>${mediaPart.toFixed(3).replace('.',',')}s</td>
                        </tr>
                    `;
                }
            });

            let mediaGeralPiloto = totalVoltasVálidasPiloto > 0 ? (somaMediasPiloto / totalVoltasVálidasPiloto) : 0;

            let globalMelhorVolta = 999999;
            dadosBase.forEach(d => {
                if (d.laps) {
                    d.laps.forEach(l => {
                        let t = typeof l === 'object' ? l.tempo : l;
                        let anul = typeof l === 'object' ? l.anulada : false;
                        if (!anul && t < globalMelhorVolta) globalMelhorVolta = t;
                    });
                }
            });
            let temVoltaMaisRapidaGeral = (Math.abs(melhorVoltaAbsolutaPiloto - globalMelhorVolta) < 0.0001);

            let vitoriasPorPiloto = {};
            let bateriasUnicas = [...new Set(dadosBase.map(d => d.bateriaKey))];
            bateriasUnicas.forEach(bk => {
                let itensBat = dadosBase.filter(d => d.bateriaKey === bk);
                if (itensBat.length > 0) {
                    let vencedorBat = itensBat.reduce((prev, curr) => (parseInt(curr.pos)||99) < (parseInt(prev.pos)||99) ? curr : prev, itensBat[0]);
                    if (vencedorBat) {
                        vitoriasPorPiloto[vencedorBat.piloto] = (vitoriasPorPiloto[vencedorBat.piloto] || 0) + 1;
                    }
                }
            });
            let maxVitoriasGrid = 0;
            for (let p in vitoriasPorPiloto) {
                if (vitoriasPorPiloto[p] > maxVitoriasGrid) maxVitoriasGrid = vitoriasPorPiloto[p];
            }
            let temMaisVitorias = (maxVitoriasGrid > 0 && (vitoriasPorPiloto[nomePiloto] || 0) === maxVitoriasGrid && vitoriasPorPiloto[nomePiloto] >= 2);

            let badgesHtml = '';
            if (temVoltaMaisRapidaGeral) {
                badgesHtml += `<div class="badge-achievement">👑 Premiação: Volta Mais Rápida Geral (${melhorVoltaAbsolutaPiloto.toFixed(3).replace('.',',')}s)</div>`;
            }
            if (temMaisVitorias) {
                badgesHtml += `<div class="badge-achievement silver">🏆 Premiação: Maior Número de Vitórias (${vitorias} vitórias)</div>`;
            }
            if (nomePiloto === pilotoMaisConsistente && totalCorridas > 0) {
                badgesHtml += `<div class="badge-achievement green-tag">🎯 Premiação: Piloto Mais Consistente (Desvio: ±${menorDesvioGlobal.toFixed(3).replace('.',',')}s)</div>`;
            }

            if (!badgesHtml) {
                badgesHtml = `<div style="font-size: 0.82rem; color: var(--text-muted); font-style: italic;">Piloto em busca de sua primeira condecoração oficial no pódio.</div>`;
            }

            let posicoesOrdenadas = Object.keys(contadorPosicoes).map(Number).sort((a,b) => a - b);
            let rankingPillsHtml = posicoesOrdenadas.map(p => `
                <div class="position-pill">
                    <span>${p}º Lugar:</span> <span>${contadorPosicoes[p]}x</span>
                </div>
            `).join('');

            let analiseLideranca = "";
            if (vitorias >= totalCorridas * 0.5) {
                analiseLideranca = `Piloto de elite e referência de desempenho na Krathus Racing. Demonstra maturidade exemplar na gestão de pneus e traçado, impondo um ritmo forte desde a primeira volta. Seu índice de aproveitamento reflete constância e alta resiliência sob pressão.`;
            } else if (vitorias > 0) {
                analiseLideranca = `Competidor altamente competitivo com picos de velocidade impressionantes e capacidade clara de vitória. O foco para a evolução na equipe reside em estabilizar a consistência ao longo de todas as voltas da bateria, evitando pequenos erros de contorno de curva que custam décimos preciosos.`;
            } else {
                analiseLideranca = `Piloto em franca curva de desenvolvimento técnico. Apresenta lampejos de excelente velocidade pura, mas ainda sofre com a oscilação em provas longas. A recomendação da liderança é focar em treinos de ritmo limpo, priorizando a segurança nas tangências antes de buscar o limite absoluto do automodelo.`;
            }

            let safeName = nomePiloto.replace(/[.#$\/\[\]]/g, "_");
            if (database) {
                database.ref('pilotos/' + safeName).once('value', snapshot => {
                    let pData = snapshot.val() || {};
                    renderizarCorpoDossiê(bodyEl, badgesHtml, totalCorridas, vitorias, melhorVoltaAbsolutaPiloto, mediaGeralPiloto, rankingPillsHtml, analiseLideranca, tabelaHistoricoHtml, nomePiloto, pData);
                });
            } else {
                renderizarCorpoDossiê(bodyEl, badgesHtml, totalCorridas, vitorias, melhorVoltaAbsolutaPiloto, mediaGeralPiloto, rankingPillsHtml, analiseLideranca, tabelaHistoricoHtml, nomePiloto, {});
            }

            modal.style.display = 'flex';
        };

        window.ativarModoEdicao = function() {
