        window.salvarDadosPiloto = function(nomePiloto) {
            if (!database) {
                alert("Firebase não conectado!");
                return;
            }
            let dados = {
                nomeCompleto: document.getElementById('edit-nome-completo').value,
                apelido: document.getElementById('edit-apelido').value,
                carro: document.getElementById('edit-carro').value,
                categoria: document.getElementById('edit-categoria').value
            };
            
            let safeName = nomePiloto.replace(/[.#$\/\[\]]/g, "_");
            database.ref('pilotos/' + safeName).set(dados).then(() => {
                alert("Ficha do piloto atualizada com sucesso!");
                abrirDossiePiloto(nomePiloto);
            }).catch(err => {
                alert("Erro ao salvar: " + err.message);
            });
        };

        window.fecharDossiePiloto = function() {
            document.getElementById('piloto-modal').style.display = 'none';
        };

        window.onclick = function(event) {
            const modal = document.getElementById('piloto-modal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        };

        window.curtirSessao = function(bateriaKey) {
            if (!database) {
                alert("Firebase não conectado!");
                return;
            }
            let safeKey = bateriaKey.replace(/[.#$\/\[\]]/g, "_");
            database.ref('likes/' + safeKey).transaction(currentLikes => (currentLikes || 0) + 1);
        };

        function escutarCurtidas(bateriaKey) {
            if (!database) return;
            let safeKey = bateriaKey.replace(/[.#$\/\[\]]/g, "_");
            database.ref('likes/' + safeKey).on('value', snapshot => {
                let count = snapshot.val() || 0;
                let el = document.getElementById(`like-count-${safeKey}`);
                if (el) el.innerText = count;
            });
        }

        window.enviarComentario = function(bateriaKey) {
            if (!database) {
                alert("Firebase não conectado!");
                return;
            }
            let safeKey = bateriaKey.replace(/[.#$\/\[\]]/g, "_");
            let nomeInput = document.getElementById(`comment-name-${safeKey}`);
            let textInput = document.getElementById(`comment-text-${safeKey}`);

            let autor = nomeInput.value.trim() || "Piloto Anônimo";
            let texto = textInput.value.trim();

            if (!texto) return;

            database.ref('comments/' + safeKey).push({
                autor: autor,
                texto: texto,
                timestamp: Date.now(),
                likes: 0,
                dislikes: 0
            });

            textInput.value = "";
        };

        window.reagirComentario = function(bateriaKey, comentarioId, tipo) {
            if (!database) return;
            let safeKey = bateriaKey.replace(/[.#$\/\[\]]/g, "_");
            let refComentario = database.ref(`comments/${safeKey}/${comentarioId}/${tipo}`);
            refComentario.transaction(currentVal => (currentVal || 0) + 1);
        };

        function escutarComentarios(bateriaKey) {
            if (!database) return;
            let safeKey = bateriaKey.replace(/[.#$\/\[\]]/g, "_");
            let listContainer = document.getElementById(`comments-list-${safeKey}`);
            
            database.ref('comments/' + safeKey).on('value', snapshot => {
                let commentsHtml = '';
                if (!snapshot.exists()) {
                    listContainer.innerHTML = `<div style="font-size:0.85rem; color: var(--text-muted); text-align:center; padding: 6px;">Nenhum comentário ainda. Seja o primeiro a comentar!</div>`;
                    return;
                }
                
                snapshot.forEach(childSnapshot => {
                    let comId = childSnapshot.key;
                    let com = childSnapshot.val();
                    let likes = com.likes || 0;
                    let dislikes = com.dislikes || 0;

                    commentsHtml += `
                        <div class="comment-item">
                            <div class="comment-header-row">
                                <span class="comment-author"><a class="piloto-link" onclick="abrirDossiePiloto('${escapeHtml(com.autor)}')">${escapeHtml(com.autor)}</a></span>
                            </div>
                            <div class="comment-text">${escapeHtml(com.texto)}</div>
                            <div class="comment-reactions">
                                <button class="btn-comment-reaction" onclick="reagirComentario('${bateriaKey}', '${comId}', 'likes')">
                                    👍 Curtir (${likes})
                                </button>
                                <button class="btn-comment-reaction" onclick="reagirComentario('${bateriaKey}', '${comId}', 'dislikes')">
                                    👎 Não Curtir (${dislikes})
                                </button>
                            </div>
                        </div>
                    `;
                });
                listContainer.innerHTML = commentsHtml;
            });
        }

        function escapeHtml(text) {
            let map = { '&': '&', '<': '<', '>': '>', '"': '"', "'": ''' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function atualizarDashboard() {
            let dadosBase = obterTodosDadosConsolidados();
            const bateriasSelecionadas = Array.from(document.querySelectorAll('.filter-bateria:checked')).map(cb => cb.value);
            const pilotosSelecionados = Array.from(document.querySelectorAll('.filter-piloto:checked')).map(cb => cb.value);
            const modulosSelecionados = Array.from(document.querySelectorAll('.filter-modulo:checked')).map(cb => cb.value);

            const dadosFiltrados = dadosBase.filter(item => 
                bateriasSelecionadas.includes(item.bateriaKey) && pilotosSelecionados.includes(item.piloto)
            );

            let melhorVoltaAbsolutaVal = 999999;
            dadosBase.forEach(item => {
                if (item.laps && item.laps.length > 0) {
                    item.laps.forEach(lapObj => {
                        let tempo = typeof lapObj === 'object' ? lapObj.tempo : lapObj;
                        let isAnulada = typeof lapObj === 'object' ? lapObj.anulada : false;
                        if (!isAnulada && tempo < melhorVoltaAbsolutaVal) {
                            melhorVoltaAbsolutaVal = tempo;
                        }
                    });
                }
            });

            if (dadosFiltrados.length > 0) {
                const vitoriasContador = {};
                bateriasSelecionadas.forEach(batKey => {
                    const itensBateria = dadosBase.filter(d => d.bateriaKey === batKey);
                    if (itensBateria.length > 0) {
                        let vencedorSessao = itensBateria.reduce((prev, curr) => {
                            let posPrev = parseInt(prev.pos) || 99;
                            let posCurr = parseInt(curr.pos) || 99;
                            return posCurr < posPrev ? curr : prev;
                        }, itensBateria[0]);
                        
                        if (vencedorSessao && pilotosSelecionados.includes(vencedorSessao.piloto)) {
                            vitoriasContador[vencedorSessao.piloto] = (vitoriasContador[vencedorSessao.piloto] || 0) + 1;
                        }
                    }
                });

                let maisVitoriasPiloto = "--";
                let maxVitorias = -1;
                for (let [piloto, vitorias] of Object.entries(vitoriasContador)) {
                    if (vitorias > maxVitorias) {
                        maxVitorias = vitorias;
                        maisVitoriasPiloto = piloto;
                    }
                }

                let vencedorEl = document.getElementById('kpi-vencedor');
                if (maisVitoriasPiloto !== "--") {
                    vencedorEl.innerHTML = `<a class="piloto-link" onclick="abrirDossiePiloto('${maisVitoriasPiloto}')">${maisVitoriasPiloto}</a>`;
                } else {
                    vencedorEl.innerText = "Nenhum";
                }
                document.getElementById('kpi-vencedor-sub').innerText = maxVitorias > 0 ? `${maxVitorias} vitória(s) nas sessões` : "Sem vitórias no filtro";

                let melhorVoltaGlobalVal = 999999;
                let melhorVoltaObj = null;
                let melhorVoltaNum = 0;

                dadosFiltrados.forEach(item => {
                    if (item.laps && item.laps.length > 0) {
                        item.laps.forEach((lapObj, idx) => {
                            let tempo = typeof lapObj === 'object' ? lapObj.tempo : lapObj;
                            let isAnulada = typeof lapObj === 'object' ? lapObj.anulada : false;
                            if (!isAnulada && tempo < melhorVoltaGlobalVal) {
                                melhorVoltaGlobalVal = tempo;
                                melhorVoltaObj = item;
                                melhorVoltaNum = idx + 1;
                            }
                        });
                    }
                });

                if (melhorVoltaObj) {
                    const DISTANCIA_PISTA = 26; // metros
                    const ESCALA = 28;
                    let velPistaMelhorMs = DISTANCIA_PISTA / melhorVoltaGlobalVal;
                    let velPistaMelhorKmh = velPistaMelhorMs * 3.6;
                    let velEscalaMelhorKmh = velPistaMelhorKmh * ESCALA;

                    document.getElementById('kpi-melhor-volta').innerText = `${melhorVoltaGlobalVal.toFixed(3).replace('.', ',')}s`;
                    document.getElementById('kpi-melhor-volta-vel').innerText = `${velEscalaMelhorKmh.toFixed(1).replace('.', ',')} km/h`;
                    document.getElementById('kpi-melhor-volta-sub').innerHTML = `<a class="piloto-link" onclick="abrirDossiePiloto('${melhorVoltaObj.piloto}')">${melhorVoltaObj.piloto}</a> (Volta ${melhorVoltaNum} - ${melhorVoltaObj.sessao})`;
                } else {
                    document.getElementById('kpi-melhor-volta').innerText = "--";
                    document.getElementById('kpi-melhor-volta-vel').innerText = "--";
                    document.getElementById('kpi-melhor-volta-sub').innerText = "Aguardando dados";
                }

                let totalVoltas = dadosFiltrados.reduce((sum, item) => {
                    if (!item.laps) return sum;
                    let validas = item.laps.filter(l => !(typeof l === 'object' && l.anulada)).length;
                    return sum + validas;
                }, 0);
                document.getElementById('kpi-total-voltas').innerText = totalVoltas;

                let somaMedias = 0;
                let contadorMedias = 0;
                let somaVelEscalaMedias = 0;
                let contadorVelEscala = 0;
                const DISTANCIA_PISTA = 26; // metros
                const ESCALA = 28;

                dadosFiltrados.forEach(item => {
                    if (item.laps && item.laps.length > 0) {
                        let lapsValidas = item.laps.filter(l => !(typeof l === 'object' && l.anulada)).map(l => typeof l === 'object' ? l.tempo : l);
                        if (lapsValidas.length > 0) {
                            let somaLaps = lapsValidas.reduce((a, b) => a + b, 0);
                            let mediaTempoPiloto = somaLaps / lapsValidas.length;
                            somaMedias += mediaTempoPiloto;
                            contadorMedias++;

                            let velPistaMediaMs = DISTANCIA_PISTA / mediaTempoPiloto;
                            let velPistaMediaKmh = velPistaMediaMs * 3.6;
                            let velEscalaMediaKmh = velPistaMediaKmh * ESCALA;

                            somaVelEscalaMedias += velEscalaMediaKmh;
                            contadorVelEscala++;
                        }
                    }
                });

                let mediaGlobal = contadorMedias > 0 ? (somaMedias / contadorMedias) : 0;
                let mediaVelEscalaGlobalKmh = contadorVelEscala > 0 ? (somaVelEscalaMedias / contadorVelEscala) : 0;

                if (mediaGlobal > 0) {
                    document.getElementById('kpi-media-global').innerText = `${mediaGlobal.toFixed(3).replace('.', ',')}s`;
                } else {
                    document.getElementById('kpi-media-global').innerText = "--";
                }

                if (mediaVelEscalaGlobalKmh > 0) {
                    document.getElementById('kpi-media-global-vel').innerText = `${mediaVelEscalaGlobalKmh.toFixed(1).replace('.', ',')} km/h`;
                } else {
                    document.getElementById('kpi-media-global-vel').innerText = "--";
                }

            } else {
                document.getElementById('kpi-vencedor').innerText = "--";
                document.getElementById('kpi-vencedor-sub').innerText = "Aguardando dados";
                document.getElementById('kpi-melhor-volta').innerText = "--";
                document.getElementById('kpi-melhor-volta-vel').innerText = "--";
                document.getElementById('kpi-melhor-volta-sub').innerText = "--";
                document.getElementById('kpi-total-voltas').innerText = "0";
                document.getElementById('kpi-media-global').innerText = "--";
                document.getElementById('kpi-media-global-vel').innerText = "--";
            }

            renderizarSessõesCompletas(dadosBase, bateriasSelecionadas, pilotosSelecionados, modulosSelecionados, melhorVoltaAbsolutaVal);
        }

        window.compartilharCorrida = function(bateriaKey, nomeSessao, vencedor) {
            let dadosBase = obterTodosDadosConsolidados();
            let itensBateria = dadosBase.filter(d => d.bateriaKey === bateriaKey);
            
            let textoResumo = `🏁 *KRATHUS RACING - TELEMETRIA* 🏁\n`;
            textoResumo += `📅 Sessão: *${nomeSessao}*\n`;
            textoResumo += `🏆 Vencedor: *${vencedor}*\n\n`;
            textoResumo += `📊 *Classificação:* \n`;
            
            itensBateria.sort((a, b) => (parseInt(a.pos) || 99) - (parseInt(b.pos) || 99));
            itensBateria.forEach(d => {
                textoResumo += `${d.pos} - ${d.piloto} (${d.voltasTotais} voltas | Melhor: ${d.melhorVoltaTxt})\n`;
            });
            
            textoResumo += `\n_Confira todos os gráficos e detalhes no painel Krathus Racing!_`;

            if (navigator.share) {
                navigator.share({
                    title: `Krathus Racing - ${nomeSessao}`,
                    text: textoResumo,
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(textoResumo).then(() => {
                    alert(`📋 Resumo da bateria "${nomeSessao}" copiado para a área de transferência!`);
                }).catch(() => {
                    alert("Não foi possível compartilhar automaticamente.");
                });
            }
        };

        function renderizarSessõesCompletas(dadosBase, bateriasSelecionadas, pilotosSelecionados, modulosSelecionados, melhorVoltaAbsolutaVal) {
            chartInstances.forEach(chart => chart.destroy());
            chartInstances = [];

            const mainContainer = document.getElementById('sessions-container');
            if (!mainContainer) return;
            mainContainer.innerHTML = '';

            if (dadosBase.length === 0) {
                mainContainer.innerHTML = `<div class="card" style="text-align:center; padding: 40px; color: var(--text-muted);">Nenhum dado encontrado para esta categoria.</div>`;
                return;
            }

            if (bateriasSelecionadas.length === 0 || pilotosSelecionados.length === 0 || modulosSelecionados.length === 0) {
                mainContainer.innerHTML = `<div class="card" style="text-align:center; padding: 30px; color: var(--text-muted);">Nenhum filtro ou módulo selecionado.</div>`;
                return;
            }

            bateriasSelecionadas.forEach((bateriaKey) => {
                const dadosSessao = dadosBase.filter(d => d.bateriaKey === bateriaKey && pilotosSelecionados.includes(d.piloto));
                if (dadosSessao.length === 0) return;

                const nomeSessao = dadosSessao[0].sessao || bateriaKey;
                let todosDaBateria = dadosBase.filter(d => d.bateriaKey === bateriaKey);
                let vencedorSessaoObj = todosDaBateria.reduce((prev, curr) => {
                    let pPrev = parseInt(prev.pos) || 99;
                    let pCurr = parseInt(curr.pos) || 99;
                    return pCurr < pPrev ? curr : prev;
                }, todosDaBateria[0]);
                let nomeVencedorSessao = vencedorSessaoObj ? vencedorSessaoObj.piloto : 'N/A';

                let safeKey = bateriaKey.replace(/[.#$\/\[\]]/g, "_");
                const chartId = `chart-${bateriaKey}`;
                const chartPosId = `chart-pos-${bateriaKey}`;

                const sessionBlock = document.createElement('div');
                sessionBlock.className = 'session-block';
                
                let vencedorLinkHtml = vencedorSessaoObj ? `<a class="piloto-link" onclick="abrirDossiePiloto('${nomeVencedorSessao}')">${nomeVencedorSessao}</a>` : 'N/A';

                let html = `
                    <div class="session-block-header">
                        <div class="session-block-title">🏁 Sessão / Bateria: ${nomeSessao}</div>
                        <div class="session-block-meta">
                            <span class="session-winner-tag">🏆 Vencedor: <strong>${vencedorLinkHtml}</strong></span>
                            <button class="btn-like" onclick="curtirSessao('${bateriaKey}')">❤️ Curtir (<span id="like-count-${safeKey}">0</span>)</button>
                            <button class="btn-share" onclick="compartilharCorrida('${bateriaKey}', '${nomeSessao}', '${nomeVencedorSessao}')">🔗 Compartilhar</button>
                        </div>
                    </div>
                `;

                if (modulosSelecionados.includes('mod-grafico')) {
                    html += `<div class="card"><div class="card-header">Evolução de Ritmo (Lap Times - Total) - ${nomeSessao}</div><div class="chart-container"><canvas id="${chartId}"></canvas></div></div>`;
                }
                if (modulosSelecionados.includes('mod-grafico-posicao')) {
                    html += `<div class="card"><div class="card-header">📊 Posição Volta a Volta (Race Position) - ${nomeSessao}</div><div class="chart-container"><canvas id="${chartPosId}"></canvas></div></div>`;
                }
                if (modulosSelecionados.includes('mod-log-posicao')) {
                    html += `<div class="card"><div class="card-header">📝 Relatório Detalhado de Ultrapassagens e Trocas de Posição - ${nomeSessao}</div><div class="position-analysis-container" style="margin-top:0;"><div class="position-analysis-title">Histórico Volta a Volta</div><div class="position-log-list" id="pos-logs-${bateriaKey}"></div></div></div>`;
                }
                if (modulosSelecionados.includes('mod-velocidade')) {
                    html += `<div class="card"><div class="card-header">🏎️ Estatísticas de Velocidade Média e Escala Real (1/28 - Pista 26m) - ${nomeSessao}</div><div class="table-container"><table><thead><tr><th>PILOTO</th><th>MELHOR TEMPO</th><th>VELO. PISTA (Melhor)</th><th>VELO. ESCALA REAL (1/28)</th><th>MÉDIA DA SESSÃO</th><th>VELO. PISTA (Média)</th><th>VELO. ESCALA REAL (Média)</th></tr></thead><tbody id="tabela-velocidade-${bateriaKey}"></tbody></table></div></div>`;
                }
                if (modulosSelecionados.includes('mod-classificacao-analise')) {
                    html += `<div class="card"><div class="card-header">Consistência (Ritmo, Comportamento e Pontos Críticos) - ${nomeSessao}</div><div class="table-container"><table><thead><tr><th>POS</th><th>PILOTO</th><th>SESSÃO</th><th>TOTAL DE VOLTAS</th><th>MELHOR</th><th>MÉDIA</th><th>DESVIO</th></tr></thead><tbody id="tabela-unificada-${bateriaKey}"></tbody></table></div></div>`;
                }
                if (modulosSelecionados.includes('mod-tabela-geral')) {
                    html += `<div class="card"><div class="card-header">Tabela Geral Volta a Volta (com Gaps ao Lado) - ${nomeSessao}</div><div class="table-container"><table><thead><tr id="head-lapbyLap-${bateriaKey}"><th>VOLTA</th></tr></thead><tbody id="body-lapbyLap-${bateriaKey}"></tbody></table></div></div>`;
                }

                html += `
                    <div class="comments-section">
                        <div class="comments-title">💬 Comentários e Reações</div>
                        <div class="comments-list" id="comments-list-${safeKey}">
                            <div style="font-size:0.85rem; color: var(--text-muted); text-align:center; padding: 6px;">Nenhum comentário ainda. Seja o primeiro a comentar!</div>
                        </div>
                        <div class="comment-form">
                            <input type="text" id="comment-name-${safeKey}" class="comment-input-name" placeholder="Seu Nome / Piloto">
                            <input type="text" id="comment-text-${safeKey}" class="comment-input-text" placeholder="Escreva seu comentário..." onkeypress="if(event.key === 'Enter') enviarComentario('${bateriaKey}')">
                            <button class="btn-comment" onclick="enviarComentario('${bateriaKey}')">Enviar</button>
                        </div>
                    </div>
                `;

                sessionBlock.innerHTML = html;
                mainContainer.appendChild(sessionBlock);

                escutarCurtidas(bateriaKey);
                escutarComentarios(bateriaKey);

                if (modulosSelecionados.includes('mod-grafico')) {
                    let maxV = Math.max(...dadosSessao.map(d => d.laps ? d.laps.length : 0));
                    const labels = Array.from({ length: maxV }, (_, i) => `V${i+1}`);
                    const datasets = dadosSessao.map(d => ({
                        label: d.piloto,
                        data: (d.laps || []).map(l => typeof l === 'object' ? l.tempo : l),
                        borderColor: obterCorPiloto(d.piloto),
                        backgroundColor: obterCorPiloto(d.piloto),
                        borderWidth: 2,
                        tension: 0.2
                    }));
                    chartInstances.push(new Chart(document.getElementById(chartId).getContext('2d'), {
                        type: 'line',
                        data: { labels, datasets },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#8492a6' } } } }
                    }));
                }

                let maxVPos = Math.max(...todosDaBateria.map(d => d.laps ? d.laps.length : 0));
                let matrizPosicoesGeral = {};
                todosDaBateria.forEach(d => { matrizPosicoesGeral[d.piloto] = []; });

                for (let v = 0; v < maxVPos; v++) {
                    let acumuladosVolta = [];
                    todosDaBateria.forEach(d => {
                        if (d.laps && d.laps.length > 0) {
                            let somaAteV = 0;
                            let voltasCompletadas = 0;
                            for (let k = 0; k <= Math.min(v, d.laps.length - 1); k++) {
                                let lapObj = d.laps[k];
                                let tempo = typeof lapObj === 'object' ? lapObj.tempo : lapObj;
                                let isAnulada = typeof lapObj === 'object' ? lapObj.anulada : false;
                                
                                if (!isAnulada) {
                                    somaAteV += tempo;
                                    voltasCompletadas++;
                                }
                            }
                            if (v >= d.laps.length) {
                                somaAteV += (v - d.laps.length + 1) * 1000;
                            }
                            acumuladosVolta.push({ piloto: d.piloto, tempoAcumulado: somaAteV, voltas: voltasCompletadas });
                        }
                    });

                    acumuladosVolta.sort((a, b) => {
                        if (b.voltas !== a.voltas) return b.voltas - a.voltas;
                        return a.tempoAcumulado - b.tempoAcumulado;
                    });

                    acumuladosVolta.forEach((item, posIndex) => {
                        matrizPosicoesGeral[item.piloto].push(posIndex + 1);
                    });
                }

                if (modulosSelecionados.includes('mod-grafico-posicao')) {
                    const labelsPos = Array.from({ length: maxVPos }, (_, i) => `Volta ${i+1}`);
                    const datasetsPos = dadosSessao.map(d => ({
                        label: d.piloto,
                        data: matrizPosicoesGeral[d.piloto] || [],
                        borderColor: obterCorPiloto(d.piloto),
                        backgroundColor: obterCorPiloto(d.piloto),
                        borderWidth: 3,
                        tension: 0.1,
                        spanGaps: true
                    }));

                    chartInstances.push(new Chart(document.getElementById(chartPosId).getContext('2d'), {
                        type: 'line',
                        data: { labels: labelsPos, datasets: datasetsPos },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    reverse: true,
                                    min: 1,
                                    max: todosDaBateria.length + 0.5,
                                    ticks: {
                                        stepSize: 1,
                                        callback: function(value) { if (Number.isInteger(value)) return `${value}º`; },
                                        color: '#8492a6'
                                    },
                                    grid: { color: 'rgba(255, 255, 255, 0.05)' }
                                },
                                x: { ticks: { color: '#8492a6' }, grid: { color: 'rgba(255, 255, 255, 0.05)' } }
                            },
                            plugins: { legend: { labels: { color: '#8492a6' } } }
                        }
                    }));
                }

                if (modulosSelecionados.includes('mod-log-posicao')) {
                    const logsContainer = document.getElementById(`pos-logs-${bateriaKey}`);
                    let logsHtml = '';
                    
                    if (maxVPos > 0) {
                        let ordemVolta1 = [];
                        todosDaBateria.forEach(d => {
                            let arr = matrizPosicoesGeral[d.piloto] || [];
                            if (arr[0]) ordemVolta1.push({ piloto: d.piloto, pos: arr[0] });
                        });
                        ordemVolta1.sort((a, b) => a.pos - b.pos);
                        let descVolta1 = ordemVolta1.map(item => `<a class="piloto-link" onclick="abrirDossiePiloto('${item.piloto}')">${item.piloto}</a> em ${item.pos}º`).join(', ');
                        logsHtml += `<div class="position-log-item">🏁 <strong>1ª Volta:</strong> O grid se consolidou com a seguinte ordem inicial: <strong>${descVolta1}</strong>.</div>`;
                    }

                    for (let v = 1; v < maxVPos; v++) {
                        let posNaVoltaAnterior = {};
                        let posNaVoltaAtual = {};

                        todosDaBateria.forEach(d => {
                            let arr = matrizPosicoesGeral[d.piloto] || [];
                            if (arr[v-1]) posNaVoltaAnterior[arr[v-1]] = d.piloto;
                            if (arr[v]) posNaVoltaAtual[arr[v]] = d.piloto;
                        });

                        let rankingAtual = [];
                        for (let p = 1; p <= todosDaBateria.length; p++) {
                            if (posNaVoltaAtual[p]) rankingAtual.push({ piloto: posNaVoltaAtual[p], posAtual: p });
                        }

                        let mudancasNestaVolta = [];

                        rankingAtual.forEach(item => {
                            let d = todosDaBateria.find(x => x.piloto === item.piloto);
                            if (!d) return;

                            let arrPos = matrizPosicoesGeral[d.piloto] || [];
                            let pAnt = arrPos[v-1] || 0;
                            let pAtu = arrPos[v] || 0;

                            let linkPiloto = `<a class="piloto-link" onclick="abrirDossiePiloto('${d.piloto}')" style="color:${obterCorPiloto(d.piloto)}">${d.piloto}</a>`;

                            if (pAnt > 0 && pAtu > 0 && pAtu !== pAnt) {
                                if (pAtu < pAnt) {
                                    let superados = [];
                                    for (let p = pAtu; p < pAnt; p++) {
                                        let pilotoSuperado = posNaVoltaAnterior[p];
                                        if (pilotoSuperado && pilotoSuperado !== d.piloto) {
                                            superados.push(`<a class="piloto-link" onclick="abrirDossiePiloto('${pilotoSuperado}')">${pilotoSuperado}</a> (${p}º)`);
                                        }
                                    }
                                    let superadosTxt = superados.length > 0 ? `, superando ${superados.join(', ')}` : "";
                                    mudancasNestaVolta.push(`🔥 <strong>${linkPiloto}</strong> avançou da <span class="tag-gain">${pAnt}ª para a ${pAtu}ª posição</span>${superadosTxt}`);
                                } 
                                else if (pAtu > pAnt) {
                                    let beneficiados = [];
                                    for (let p = pAnt + 1; p <= pAtu; p++) {
                                        let pilotoBeneficiado = posNaVoltaAtual[p];
                                        if (pilotoBeneficiado && pilotoBeneficiado !== d.piloto) {
                                            beneficiados.push(`<a class="piloto-link" onclick="abrirDossiePiloto('${pilotoBeneficiado}')">${pilotoBeneficiado}</a> (${p}º)`);
                                        }
                                    }
                                    let beneficiadosTxt = beneficiados.length > 0 ? `, cedendo posições para ${beneficiados.join(' e ')}` : "";
                                    mudancasNestaVolta.push(`💧 <strong>${linkPiloto}</strong> caiu da <span class="tag-loss">${pAnt}ª para a ${pAtu}ª posição</span>${beneficiadosTxt}`);
                                }
                            }
                        });

                        if (mudancasNestaVolta.length > 0) {
                            logsHtml += `<div class="position-log-item">🔄 <strong>Volta ${v+1}:</strong> ${mudancasNestaVolta.join(' | ')}.</div>`;
                        }
                    }

                    if (logsHtml === '') logsHtml = `<div class="position-log-item">🏎️ Prova estável sem trocas de posição registradas.</div>`;
                    logsContainer.innerHTML = logsHtml;
                }

                if (modulosSelecionados.includes('mod-velocidade')) {
                    const tbodyVel = document.getElementById(`tabela-velocidade-${bateriaKey}`);
                    const DISTANCIA_PISTA = 26; // metros
                    const ESCALA = 28;

                    dadosSessao.forEach(item => {
                        let lapsRaw = item.laps || [];
                        if (lapsRaw.length === 0) return;

                        let lapsValidas = lapsRaw.filter(l => !(typeof l === 'object' && l.anulada)).map(l => typeof l === 'object' ? l.tempo : l);
                        if (lapsValidas.length === 0) return;

                        let melhorTempo = Math.min(...lapsValidas);
                        let somaLaps = lapsValidas.reduce((a, b) => a + b, 0);
                        let mediaTempo = somaLaps / lapsValidas.length;

                        let velPistaMelhorMs = DISTANCIA_PISTA / melhorTempo;
                        let velPistaMelhorKmh = velPistaMelhorMs * 3.6;
                        let velEscalaMelhorKmh = velPistaMelhorKmh * ESCALA;

                        let velPistaMediaMs = DISTANCIA_PISTA / mediaTempo;
                        let velPistaMediaKmh = velPistaMediaMs * 3.6;
                        let velEscalaMediaKmh = velPistaMediaKmh * ESCALA;

                        let linkPiloto = `<a class="piloto-link" onclick="abrirDossiePiloto('${item.piloto}')">${item.piloto}</a>`;

                        tbodyVel.innerHTML += `
                            <tr>
                                <td><strong>${linkPiloto}</strong></td>
                                <td class="text-green">${melhorTempo.toFixed(3).replace('.',',')}s</td>
                                <td>${velPistaMelhorKmh.toFixed(2).replace('.',',')} km/h</td>
                                <td><strong style="color: var(--accent-gold);">${velEscalaMelhorKmh.toFixed(1).replace('.',',')} km/h</strong></td>
                                <td>${mediaTempo.toFixed(3).replace('.',',')}s</td>
                                <td>${velPistaMediaKmh.toFixed(2).replace('.',',')} km/h</td>
                                <td><strong>${velEscalaMediaKmh.toFixed(1).replace('.',',')} km/h</strong></td>
                            </tr>
                        `;
                    });
                }

                if (modulosSelecionados.includes('mod-classificacao-analise')) {
                    const tbody = document.getElementById(`tabela-unificada-${bateriaKey}`);
                    dadosSessao.forEach(item => {
                        let lapsRaw = item.laps || [];
                        let lapsValidas = lapsRaw.filter(l => !(typeof l === 'object' && l.anulada)).map(l => typeof l === 'object' ? l.tempo : l);
                        if (lapsValidas.length === 0) return;

                        let melhorTempo = Math.min(...lapsValidas);
                        let mediaVal = lapsValidas.reduce((a,b)=>a+b,0) / lapsValidas.length;
                        let variancia = lapsValidas.length > 1 ? lapsValidas.reduce((sum, t) => sum + Math.pow(t - mediaVal, 2), 0) / lapsValidas.length : 0;
                        let stdDevCalc = Math.sqrt(variancia);
                        let desvioTxt = `±${stdDevCalc.toFixed(3).replace('.',',')}s`;

                        let nivelConstancia = "";
                        let diagnosticoCausas = "";

                        if (stdDevCalc < 1.2) {
                            nivelConstancia = "🟢 Alta Constância (Ritmo Exemplar / Padrão Metrônomo)";
                            diagnosticoCausas = "O piloto demonstrou um controle de pilotagem impecável e alta maturidade no traçado. A baixíssima oscilação de tempo por volta indica repetibilidade exata de frenagem, aceleração progressiva sem perda de tração e pilotagem limpa longe das muretas.";
                        } else if (stdDevCalc >= 1.2 && stdDevCalc < 3.5) {
                            nivelConstancia = "🟡 Constância Moderada (Oscilações Intermitentes e Desgaste)";
                            diagnosticoCausas = "O ritmo geral foi competitivo, mas pontuado por variações perceptíveis de desempenho. O desvio padrão nesta faixa aponta para pequenas escapadas de frente/traseira ao forçar o limite de aderência do piso, freadas ligeiramente intempestivas ou micro-tráfego na pista.";
                        } else {
                            nivelConstancia = "🔴 Baixa Constância (Instabilidade Crítica e Recuperações)";
                            diagnosticoCausas = "O índice de variação indica uma bateria de alto risco ou com eventos severos de perda de tempo. O comportamento aponta para rodadas completas, capotamentos, batidas fortes nas barreiras ou tempo excessivo gasto em manobras de recuperação de pista.";
                        }

                        let voltasLentas = [];
                        lapsValidas.forEach((t) => {
                            if (t > mediaVal + (stdDevCalc * 1.5) && t > 12.0) {
                                voltasLentas.push(`Volta (${t.toFixed(3).replace('.',',')}s)`);
                            }
                        });

                        let alertaVoltas = voltasLentas.length > 0 
                            ? `<br>⚠️ <strong>Análise de Pontos Críticos:</strong> Picos significativos de perda de tempo isolados nos giros: <strong>${voltasLentas.slice(0, 5).join(', ')}</strong>. Estes registros evidenciam falhas pontuais de traçado ou incidentes isolados de prova.`
                            : `<br>✨ <strong>Fluidez de Prova:</strong> O piloto não apresentou discrepâncias graves ou voltas excessivamente penalizadas; o tempo perdido foi linear e distribuído de forma homogênea.`;

                        let linkPiloto = `<a class="piloto-link" onclick="abrirDossiePiloto('${item.piloto}')">${item.piloto}</a>`;

                        tbody.innerHTML += `
                            <tr class="main-row">
                                <td><span class="pos-badge" style="background:${item.badgeColor || '#ffb703'};">${item.pos || '1º'}</span></td>
                                <td><strong>${linkPiloto}</strong></td>
                                <td><span class="session-badge">${item.sessao || bateriaKey}</span></td>
                                <td><strong>${lapsValidas.length} voltas válidas</strong></td>
                                <td class="text-green">${melhorTempo.toFixed(3).replace('.',',')}s</td>
                                <td>${mediaVal.toFixed(3).replace('.',',')}s</td>
                                <td>${desvioTxt}</td>
                            </tr>
                            <tr class="sub-row">
                                <td colspan="7">
                                    <div class="analysis-subrow-box">
                                        <strong class="title">🔍 Laudo Técnico Avançado de Consistência - ${item.piloto}</strong>
                                        <strong>Avaliação de Ritmo:</strong> ${nivelConstancia}<br>
                                        <strong>Diagnóstico de Comportamento:</strong> ${diagnosticoCausas}
                                        ${alertaVoltas}
                                    </div>
                                </td>
                            </tr>
                        `;
                    });
                }

                if (modulosSelecionados.includes('mod-tabela-geral')) {
                    const headerLap = document.getElementById(`head-lapbyLap-${bateriaKey}`);
                    const bodyLap = document.getElementById(`body-lapbyLap-${bateriaKey}`);
                    
                    dadosSessao.forEach(d => {
                        let linkPilotoHeader = `<a class="piloto-link" onclick="abrirDossiePiloto('${d.piloto}')">${d.piloto}</a>`;
                        headerLap.innerHTML += `<th><span style="color:${obterCorPiloto(d.piloto)}">●</span> ${linkPilotoHeader}</th>`;
                    });
                    
                    let maxV = Math.max(...dadosSessao.map(d => d.laps ? d.laps.length : 0));
                    for (let i = 0; i < maxV; i++) {
                        let linha = `<td><strong>Volta ${i+1}</strong></td>`;
                        
                        let acumuladosVoltaAtual = [];
                        todosDaBateria.forEach(d => {
                            if (d.laps && d.laps.length > 0) {
                                let somaAteV = 0;
                                let voltasCompletadas = 0;
                                for (let k = 0; k <= Math.min(i, d.laps.length - 1); k++) {
                                    let lapObj = d.laps[k];
                                    let tempo = typeof lapObj === 'object' ? lapObj.tempo : lapObj;
                                    let isAnulada = typeof lapObj === 'object' ? lapObj.anulada : false;
                                    
                                    if (!isAnulada) {
                                        somaAteV += tempo;
                                        voltasCompletadas++;
                                    }
                                }
                                if (i >= d.laps.length) {
                                    somaAteV += (i - d.laps.length + 1) * 1000;
                                }
                                acumuladosVoltaAtual.push({ piloto: d.piloto, tempoAcumulado: somaAteV, voltas: voltasCompletadas });
                            }
                        });

                        acumuladosVoltaAtual.sort((a, b) => {
                            if (b.voltas !== a.voltas) return b.voltas - a.voltas;
                            return a.tempoAcumulado - b.tempoAcumulado;
                        });

                        dadosSessao.forEach(d => {
                            if (d.laps && i < d.laps.length) {
                                let lapObj = d.laps[i];
                                let t = typeof lapObj === 'object' ? lapObj.tempo : lapObj;
                                let isAnulada = typeof lapObj === 'object' ? lapObj.anulada : false;

                                if (isAnulada) {
                                    linha += `<td><div class="lap-cell-inline"><span class="gato-lap-highlight" title="Volta Anulada">🐱 ${t.toFixed(3).replace('.',',')}s Anulada</span></div></td>`;
                                } else {
                                    let isAbsoluteFast = (Math.abs(t - melhorVoltaAbsolutaVal) < 0.0001);
                                    let lapsValidas = d.laps.filter(l => !(typeof l === 'object' && l.anulada)).map(l => typeof l === 'object' ? l.tempo : l);
                                    let melhorPilotoVal = lapsValidas.length > 0 ? Math.min(...lapsValidas) : 999;
                                    let isFast = (Math.abs(t - melhorPilotoVal) < 0.0001);

                                    let indexNoRanking = acumuladosVoltaAtual.findIndex(x => x.piloto === d.piloto);
                                    let gapTxt = "";
                                    if (indexNoRanking > 0) {
                                        let anterior = acumuladosVoltaAtual[indexNoRanking - 1];
                                        let atualObj = acumuladosVoltaAtual[indexNoRanking];
                                        let diff = atualObj.tempoAcumulado - anterior.tempoAcumulado;
                                        gapTxt = diff >= 0 ? `+${diff.toFixed(3).replace('.',',')}s` : `${diff.toFixed(3).replace('.',',')}s`;
                                    } else if (indexNoRanking === 0) {
                                        gapTxt = "Líder";
                                    }

                                    let inlineSubtext = gapTxt ? `<span class="lap-diff-inline">(${gapTxt})</span>` : "";
                                    let tempoFormatado = `${t.toFixed(3).replace('.',',')}s`;

                                    if (isAbsoluteFast) {
                                        linha += `<td><div class="lap-cell-inline"><span class="absolute-fastest-lap-highlight" title="Volta Mais Rápida Absoluta Geral!">👑 ${tempoFormatado}</span> ${inlineSubtext}</div></td>`;
                                    } else if (isFast) {
                                        linha += `<td><div class="lap-cell-inline"><span class="fastest-lap-highlight">⚡ ${tempoFormatado}</span> ${inlineSubtext}</div></td>`;
                                    } else {
                                        linha += `<td><div class="lap-cell-inline"><span>${tempoFormatado}</span> ${inlineSubtext}</div></td>`;
                                    }
                                }
                            } else { linha += `<td>-</td>`; }
                        });
                        bodyLap.innerHTML += `<tr>${linha}</tr>`;
                    }
                }
            });
        }

        function gerarRelatórioPDF() { window.print(); }
    </script>
</body>
</html>
