<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krathus Racing - Central de Telemetria</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-body: #0d111a; --bg-card: #151c28; --bg-card-header: #1c2638; --bg-input: #1c263b;
            --border-card: #222d42; --text-title: #ffffff; --text-main: #d0d7e3; --text-muted: #8492a6;
            --accent-red: #e63946; --accent-green: #2ec4b6; --accent-gold: #ffb703; --accent-blue: #3a86ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); padding: 24px; }
        .dashboard-container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

        /* Estilos mantidos para layout, botões e modais */
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 20px 24px; border-radius: 12px; border: 1px solid var(--border-card); }
        .btn { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .btn-text-action { background: transparent; border: none; color: var(--accent-blue); font-size: 0.78rem; font-weight: 600; cursor: pointer; }
        .piloto-link { color: var(--accent-blue); text-decoration: none; font-weight: 700; cursor: pointer; }
        .piloto-link:hover { color: var(--accent-gold); text-decoration: underline; }
        
        #piloto-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(13, 17, 26, 0.88); z-index: 10000; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
        .modal-content { background: var(--bg-card); border: 1px solid var(--border-card); border-top: 5px solid var(--accent-gold); border-radius: 14px; width: 100%; max-width: 900px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        .modal-header { padding: 20px 24px; background: var(--bg-card-header); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-card); }
        .modal-body { padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .badges-podium-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .badge-achievement { background: linear-gradient(135deg, rgba(255, 183, 3, 0.2) 0%, rgba(255, 183, 3, 0.05) 100%); border: 1px solid var(--accent-gold); color: var(--accent-gold); padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; }
        
        .dossier-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        .dossier-kpi { background: var(--bg-input); border: 1px solid var(--border-card); border-radius: 8px; padding: 14px; text-align: center; }
        .dossier-kpi-value { font-size: 1.25rem; font-weight: 700; color: var(--accent-gold); }
        
        .comment-input-text { width: 100%; background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 6px; padding: 8px; color: var(--text-main); margin-bottom: 5px; }
        .btn-comment { background: var(--accent-blue); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- MODAL DE DOSSIÊ -->
    <div id="piloto-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modal-piloto-nome">🏎️ Ficha do Piloto</div>
                <button class="modal-close" onclick="fecharDossiePiloto()" style="border:none; background:none; color:#fff; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <div class="modal-body" id="modal-piloto-corpo"></div>
        </div>
    </div>

    <div class="dashboard-container">
        <header class="header">
            <div class="brand-title"><h1>🏁 KRATHUS RACING</h1></div>
            <button class="btn btn-pdf-global" onclick="window.print()">📄 Gerar Relatório</button>
        </header>
        <div id="sessions-container" class="session-blocks-container"></div>
    </div>

    <script src="banco-de-dados.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDCTkeIa6QsY2zYs8S__HlIwcY-zcuhZCA",
            databaseURL: "https://krathus-telemetria-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const SENHA_ADMIN = "krathus2026";

        window.abrirDossiePiloto = function(nomePiloto) {
            window.pilotoAtual = nomePiloto;
            const modal = document.getElementById('piloto-modal');
            const bodyEl = document.getElementById('modal-piloto-corpo');
            document.getElementById('modal-piloto-nome').innerHTML = `🏎️ Dossiê: ${nomePiloto}`;

            db.ref('pilotos/' + nomePiloto.replace(/[.#$\/\[\]]/g, "_")).once('value', snapshot => {
                let p = snapshot.val() || {};
                
                bodyEl.innerHTML = `
                    <div class="badges-podium-container" id="badges-container"></div>
                    <div class="dossier-grid">
                        <div class="dossier-kpi"><span class="dossier-kpi-label">Carro</span><div class="dossier-kpi-value">${p.carro || 'N/A'}</div></div>
                        <div class="dossier-kpi"><span class="dossier-kpi-label">Categoria</span><div class="dossier-kpi-value">${p.categoria || 'N/A'}</div></div>
                        <div class="dossier-kpi"><span class="dossier-kpi-label">Apelido</span><div class="dossier-kpi-value">${p.apelido || 'N/A'}</div></div>
                    </div>
                    <div class="card" style="background: var(--bg-input);">
                        <button class="btn-text-action" id="btn-admin-mode" onclick="ativarModoEdicao()">🔑 Ativar Modo Edição</button>
                        <div id="form-edicao-piloto" style="display: none; flex-direction: column; gap: 8px;">
                            <input type="text" id="edit-carro" placeholder="Modelo do Carro" class="comment-input-text">
                            <input type="text" id="edit-categoria" placeholder="Categoria" class="comment-input-text">
                            <input type="text" id="edit-apelido" placeholder="Apelido" class="comment-input-text">
                            <button class="btn-comment" onclick="salvarDadosPiloto('${nomePiloto}')">💾 Salvar Ficha</button>
                        </div>
                    </div>
                `;
                modal.style.display = 'flex';
            });
        };

        window.ativarModoEdicao = function() {
            let senha = prompt("Senha do Líder:");
            if (senha === SENHA_ADMIN) {
                document.getElementById('form-edicao-piloto').style.display = 'flex';
                document.getElementById('btn-admin-mode').style.display = 'none';
            } else { alert("Senha incorreta!"); }
        };

        window.salvarDadosPiloto = function(nomePiloto) {
            let safeName = nomePiloto.replace(/[.#$\/\[\]]/g, "_");
            db.ref('pilotos/' + safeName).set({
                carro: document.getElementById('edit-carro').value,
                categoria: document.getElementById('edit-categoria').value,
                apelido: document.getElementById('edit-apelido').value
            });
            alert("Ficha salva!");
            location.reload();
        };

        window.fecharDossiePiloto = function() { document.getElementById('piloto-modal').style.display = 'none'; };
    </script>
</body>
</html>
