<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krathus Racing | Central de Telemetria</title>
    <!-- Estilos e dependências do site -->
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #ffb703;
            --border-color: #333333;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }
        .painel-controle {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .btn-acao {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-acao:hover {
            opacity: 0.85;
        }
        .container-baterias {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .bateria-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        .bateria-card h3 {
            margin-top: 0;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>Krathus Racing</h1>
        <p>Central de Telemetria - Pista Coberta de Alto Desempenho em EVA</p>
    </header>

    <!-- Área de Filtros e Controles -->
    <div class="painel-controle">
        <!-- Botão de Resetar Filtros -->
        <button id="btnResetarFiltros" class="btn-acao">Resetar Filtros</button>

        <!-- Botão de Gerar Relatório PDF Completo posicionado ao lado -->
        <button id="btnRelatorioPdf" class="btn-acao">Gerar Relatório PDF Completo</button>
    </div>

    <!-- Container onde a telemetria das baterias é carregada -->
    <div id="appContainer" class="container-baterias">
        <!-- Os dados do banco-de-dados.js são injetados aqui dinamicamente -->
    </div>

    <!-- Script de Integração -->
    <script src="banco-de-dados.js"></script>
    <script>
        // Lógica de inicialização e manipulação do banco de dados na interface
        document.addEventListener("DOMContentLoaded", () => {
            console.log("Krathus Racing Telemetry carregada com sucesso. Total de baterias no cache:", typeof listaJsonsCache !== 'undefined' ? listaJsonsCache.length : 0);
            
            // Exemplo de manipulação dos botões reposicionados
            const btnResetar = document.getElementById("btnResetarFiltros");
            const btnPdf = document.getElementById("btnRelatorioPdf");

            if(btnResetar) {
                btnResetar.addEventListener("click", () => {
                    console.log("Filtros resetados.");
                });
            }

            if(btnPdf) {
                btnPdf.addEventListener("click", () => {
                    console.log("Gerando relatório PDF completo...");
                });
            }
        });
    </script>
</body>
</html>
